<style>

<body>
<header><div class="hd">
  <div><h1>遺室帳本</h1><small id="who"></small></div>
  <button class="gear" data-a="tab" data-v="set">設定</button>
</div></header>
<main id="app"></main>
<nav><div class="in" id="nav"></div></nav>
<div id="toast" role="status"></div>

<script>
/* ───────── 狀態 ───────── */
const LS = {
  get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const S = {
  url: LS.get('isl_url'), user: LS.get('isl_user'), pin: LS.get('isl_pin'),
  B: null, tab: 'add', page: '', ctx: '', anchor: '', cls: null, action: '', busy: false, editing: null, openEntry: '', month: '', listMonth: '', items: null, summary: null, stockView: 0,
  F: {}
};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n) => (n < 0 ? '−' : '') + '$' + Math.abs(Math.round(n || 0)).toLocaleString('en-US');
const num = (v) => { const n = Number(v); return isFinite(n) ? n : 0; };

async function api(body){
  if (!S.url || !S.user || !S.pin) throw new Error('請先到「設定」填入連線資料');
  const res = await fetch(S.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({}, body, { user: S.user, pin: S.pin })) });
  let d; try { d = await res.json(); } catch(e){ throw new Error('連線失敗，請確認 API 網址與部署授權'); }
  if (d.error) throw new Error(d.error);
  return d;
}

/* ───────── 活動（讀試算表「活動」表） ───────── */
function activePromo(channel){
  const d = today();
  return S.B.promos.find((p) => p.start <= d && d <= p.end && (p.channel === '全部' || p.channel === channel)) || null;
}
function promoState(f){
  const pr = activePromo(f.channel);
  if (!pr) return null;
  const hits = f.cart.filter((l) => { const p = prod(l.id); return (!pr.cat || pr.cat === '任一商品' || p.cat === pr.cat) && (!pr.item || pr.item === p.id || pr.item === p.name); });
  const qty = hits.reduce((t, l) => t + l.qty, 0);
  const amt = hits.reduce((t, l) => t + (prod(l.id).price || 0) * l.qty, 0);
  let slots = 0;
  if (pr.minAmt > 0) slots = amt >= pr.minAmt ? (pr.repeat ? Math.floor(amt / pr.minAmt) : 1) : 0;
  else { const mq = pr.minQty || 1; slots = qty >= mq ? (pr.repeat ? Math.floor(qty / mq) : 1) : 0; }
  if (!slots) return { pr, slots: 0, gifts: [] };
  let gifts = [];
  if (pr.mode === '全部送') gifts = pr.options.map((id) => ({ id, qty: pr.perQty * slots }));
  else if (pr.mode === '同款香') {
    let left = slots;
    hits.forEach((l) => { const base = prod(l.id).name; const opt = pr.options.find((id) => prod(id).name.indexOf(base) === 0); const n = Math.min(left, l.qty); if (opt && n > 0) { gifts.push({ id: opt, qty: n * pr.perQty }); left -= n; } });
  } else {
    f.picks.slice(0, slots).forEach((id) => { if (id) gifts.push({ id, qty: pr.perQty }); });
  }
  const agg = {}; gifts.forEach((g) => { agg[g.id] = (agg[g.id] || 0) + g.qty; });
  return { pr, slots, gifts: Object.keys(agg).map((id) => ({ id, qty: agg[id] })) };
}

/* ───────── 課程計價（與預約系統相同的算法） ───────── */
function coursePrice(c, n){
  if (!c) return null;
  const p1 = c.prices[0]; if (p1 === null) return null;
  const combos = {}; [2,3,4].forEach((k) => { if (c.prices[k-1] !== null) combos[k] = c.prices[k-1]; });
  if (combos[n]) return combos[n];
  let best = n * p1;
  Object.keys(combos).forEach((k) => { const cnt = +k; const total = combos[k] + (n - cnt) * p1; if (cnt < n && total < best) best = total; });
  return best;
}

function courseNote(f){
  const rec = f.classDate ? f.classDate.slice(0, 7) : '';
  return !f.classDate ? '請選上課日期' : rec > f.date.slice(0, 7) ? `上課在 ${rec}：錢今天進帳戶，但先算「預收課程款」，上完課那個月才算收入。學員取消時要退。` : `上課在 ${rec}：算 ${rec} 的收入。`;
}

// 對帳對象：同一個「合併群組」的寄售點合成一個（例如 ASA 桃園＋台中，合併報表、一起匯款）
function reconTargets(){
  const out = [], seen = {};
  S.B.stores.forEach((st) => {
    if (st.group) {
      if (seen[st.group]) return; seen[st.group] = 1;
      const members = S.B.stores.filter((x) => x.group === st.group);
      out.push({ key: 'G:' + st.group, group: st.group, label: st.group + '（' + members.map((x) => x.name.replace(st.group, '').trim()).join('＋') + '）', members, cfg: st });
    } else out.push({ key: st.name, group: '', label: st.name, members: [st], cfg: st });
  });
  return out;
}

  expense(){
    const f = S.F.expense;
    const all = S.B.categories;
    const only = (S.ctx === 'g' || S.ctx === 'pg') && S.gcats;
    const groups = only ? [[S.glabel || '類別', S.gcats]] : f.scope === '店務'
      ? [['固定帳單', all.filter((c) => FIXED_BILLS.indexOf(c.name) > -1).map((c) => c.name)],
         ['進貨與製作', all.filter((c) => c.group === '營業成本').map((c) => c.name)],
         ['日常開銷', all.filter((c) => c.group === '營業費用' && FIXED_BILLS.indexOf(c.name) < 0).map((c) => c.name)],
         ['稅金', ['營業稅']]]
      : [['個人支出', all.filter((c) => c.group === '個人支出').map((c) => c.name)]];
    const accs = expenseAccs(f);
    const isTax = f.scope === '店務' && f.category === '營業稅';
    const warn = isTax ? '這筆會記成「繳營業稅」，不算費用（收入裡的 5% 已經先扣過了）。從稅金預留付是正常情況；用個人帳戶付會自動算成代墊，之後店再還。'
      : f.scope === '店務' && accScope(f.account) === '個人' ? '用個人的錢付店的支出，會自動記成「代墊」，月報會累計未還金額。'
      : f.scope === '店務' && f.account === '固定支出預留' ? '從每月撥存的「固定支出預留」付，不會動到營運的錢。'
      : f.scope === '個人' && accScope(f.account) === '店務' ? '個人開銷從店的帳戶付出，等於直接從店裡拿錢。比較乾淨的做法：先發薪水到個人帳戶，再從個人帳戶付。' : '';
    const ship = S.gk === 'out:ship' && only;
    return `<h3>${!only ? '支出' : ship ? '寄什麼、用哪家？' : S.gk === 'out:tax' ? '繳營業稅' : S.glabel || '支出'}</h3>
      ${only ? '' : `<div class="grid g2">${chip(f.scope === '店務', 'set', 'expense.scope|店務', '店務', 'sq')}${chip(f.scope === '個人', 'set', 'expense.scope|個人', '個人', 'sq')}</div>`}
      ${ship ? '<div class="hint">這裡記「寄出去」的運費。廠商寄貨給我們的運費，記在「店裡其他開銷 › 收貨運費」。</div>' : ''}
      ${only && S.gcats.length < 2 ? '' : groups.filter((g) => g[1].length).map(([g, names]) => `<div>${only ? '' : `<p class="lab">${g}</p>`}<div class="chips">${names.map((n) => chip(f.category === n, 'set', 'expense.category|' + n, esc(n))).join('')}</div></div>`).join('')}
      ${f.category === '收貨運費' ? '<div class="hint">廠商、淘寶寄貨給我們時付的運費記在這裡，對象填哪家廠商。</div>' : ''}
      ${f.scope === '店務' && !isTax && FIXED_BILLS.indexOf(f.category) < 0 && (S.B.bomNames || []).length ? `<div><p class="lab">這是第二批生產的採購嗎？</p><div class="grid g2">${chip(!f.batch, 'set', 'expense.batch|', '不是', 'sq')}${chip(!!f.batch, 'set', 'expense.batch|第二批', '是，第二批', 'sq')}</div>
        ${f.batch ? `<p class="lab" style="margin-top:8px">對應哪一項物料（不確定可以不選）</p><div class="chips">${S.B.bomNames.map((n) => chip(f.bom === n, 'set', 'expense.bom|' + n, esc(n))).join('')}</div><div class="hint" style="margin-top:8px">第二批的採購先算庫存，不算這個月的費用；做完算出每件成本後，賣出時才扣。</div>` : ''}</div>` : ''}
      ${field('expense.amount', '金額（照收據填）', inp('expense.amount', 'number', f.amount, 'big', '0'))}
      <div><p class="lab">用哪個帳戶付</p><div class="chips">${accs.map((a) => chip(f.account === a.name, 'set', 'expense.account|' + a.name, esc(a.name), 'sq')).join('')}</div></div>
      ${warn ? `<div class="hint">${warn}</div>` : ''}
      ${f.category === '運費' ? `<div><p class="lab">寄件方式（點一下帶入對象）</p><div class="grid g3">${['全家', '萊爾富', '郵局', '黑貓'].map((k) => chip(f.party === k, 'set', 'expense.party|' + k, k, 'sq')).join('')}${chip(!!f.oth && ['全家', '萊爾富', '郵局', '黑貓'].indexOf(f.party) < 0, 'set', 'expense.oth|1', '其他', 'sq')}</div></div>` : ''}
      ${isTax ? '' : field('expense.party', f.category === '運費' && f.oth && ['全家', '萊爾富', '郵局', '黑貓'].indexOf(f.party) < 0 ? '用哪家寄？（例：順豐、店到店）' : '對象（選填，例：黑貓、某廠商）', inp('expense.party', 'text', f.party))}
      ${dateNote(f, 'expense')}`;
  },
  collab(){
    const f = S.F.collab;
    return `<h3>品牌合作</h3>
      <div class="chips">${['創業顧問', '活動企劃費', '報名抽成'].concat(['活動策劃', '活動收入'].indexOf(f.kind) > -1 ? [f.kind] : []).map((k) => chip(f.kind === k, 'set', 'collab.kind|' + k, k, 'sq')).join('')}</div>

      ${field('collab.party', '合作對象', inp('collab.party', 'text', f.party, '', '例：品牌或活動名稱'))}
      ${f.kind === '活動企劃費' ? '' : field('collab.eventDate', f.kind === '創業顧問' ? '服務日期（選填，不填就算在收款月份）' : SAMEDAY.indexOf(f.kind) > -1 ? '活動日期（選填，不填＝收款日期）' : '活動舉辦日期', inp('collab.eventDate', 'date', f.eventDate))}
      ${f.kind === '報名抽成' ? `<div class="grid g2">${field('collab.people', '報名人數', inp('collab.people', 'number', f.people, '', '0'))}${field('collab.per', '每人抽成', inp('collab.per', 'number', f.per, '', '0'))}</div>
      <div class="kv b"><span>抽成合計</span><span>${money(num(f.people) * num(f.per))}</span></div>` : field('collab.amount', '金額（含稅）', inp('collab.amount', 'number', f.amount, 'big', '0'))}
      <div><p class="lab">收進哪個帳戶</p><div class="chips">${recvAccs().map((a) => chip(f.account === a.name, 'set', 'collab.account|' + a.name, esc(a.name), 'sq')).join('')}</div></div>
      <div class="sum"><span class="lab" id="collab-note" style="margin:0">${collabNote(f)}</span></div>
      ${dateNote(f, 'collab', '收款日期（錢進帳戶那天）')}`;
  },
  consign(){
    const f = S.F.consign;
    const b = S.B.brands.find((x) => x.name === f.brand) || { rate: 0.4 };
    const price = num(f.price), tax = price * 0.05, shop = (price - tax) * b.rate, brand = price - tax - shop;
    return `<h3>代售：店內寄賣品牌賣出</h3>
      <div class="chips">${S.B.brands.map((x, i) => chip(f.brand === x.name, 'pickIdx', 'consign.brand|brands|' + i, esc(x.name))).join('')}</div>
      ${field('consign.price', '售價', inp('consign.price', 'number', f.price, 'big', '0'))}
      <div><p class="lab">收進哪個帳戶</p><div class="chips">${recvAccs().map((a) => chip(f.account === a.name, 'set', 'consign.account|' + a.name, esc(a.name), 'sq')).join('')}</div></div>
      <div class="sum"><span class="lab" style="margin:0">先扣 5% 稅，再依 店 ${Math.round(b.rate * 10)}：品牌 ${Math.round((1 - b.rate) * 10)} 拆帳</span>
        <div class="kv"><span>稅金</span><span>${money(tax)}</span></div><div class="kv b in-c"><span>店的收入</span><span>${money(shop)}</span></div><div class="kv" style="color:var(--warn)"><span>應付品牌（不是店的錢）</span><span>${money(brand)}</span></div></div>
      ${dateNote(f, 'consign')}`;
  },
  send(){
    const f = S.F.send;
    return `<h3>寄售送貨</h3>
      <div class="grid g2">${S.B.stores.map((x, i) => chip(f.store === x.name, 'pickIdx', 'send.store|stores|' + i, esc(x.name), 'sq')).join('')}</div>
      <p class="lab" style="margin:0">這次叫貨的品項全部填完，再一次送出（右側為店內庫存）</p>
      <div>${itemRows('sendQ', f.q, ALLCATS, '店內')}</div>
      <div class="sum"><span class="lab" style="margin:0">錢沒有動，只是貨換地方放：店內逐項減少、${esc(f.store)} 逐項增加。運費另外用「支出 › 運費」記。</span></div>
      ${dateNote(f, 'send')}`;
  },
  recon(){
    const f = S.F.recon;
    const T = reconTargets();
    const tg = T.find((x) => x.key === f.store) || T[0] || { members: [], cfg: {} };
    const st = tg.cfg || {};
    const months = [-2, -1, 0].map((d) => addMonth(curMonth(), d));
    const head = `<h3>寄售對帳／收款</h3>
      ${S.ctx === 'g' || S.ctx === 'cls' ? '' : `<div class="grid g2">${chip(f.mode === '對帳', 'set', 'recon.mode|對帳', '對帳（報表到了）', 'sq')}${chip(f.mode === '收款', 'set', 'recon.mode|收款', '收款（錢到了）', 'sq')}</div>`}
      <div class="grid g2">${T.map((x, i) => chip(f.store === x.key, 'reconT', i, esc(x.label), 'sq')).join('')}</div>
      <div><p class="lab">銷售月份（收入算在這個月，不是收款日）</p><div class="grid g3">${months.map((m) => chip(f.salesMonth === m, 'set', 'recon.salesMonth|' + m, m.replace('-', ' / '), 'sq')).join('')}</div></div>`;
    if (f.mode === '收款') {
      return head + `${field('recon.amount', tg.members.length > 1 ? '實收金額（合併匯款的總額）' : '實收金額', inp('recon.amount', 'number', f.amount, 'big', '0'))}
        <div><p class="lab">收進哪個帳戶</p><div class="chips">${recvAccs().map((a) => chip(f.account === a.name, 'set', 'recon.account|' + a.name, esc(a.name), 'sq')).join('')}</div></div>
        <div class="sum"><span class="lab" style="margin:0">收款會沖銷「寄售應收未收」，不會重複算成收入。</span></div>${dateNote(f, 'recon')}`;
    }
    const multi = tg.members.length > 1;
    const short = (x) => multi ? x.name.replace(tg.group, '').trim() : '';
    let rows = '';
    ALLCATS.forEach((c) => { const ps = byCat(c); if (!ps.length) return;
      const n = ps.reduce((t, p) => t + tg.members.reduce((a, _, i) => a + (f.q[i + ':' + p.id] || 0), 0), 0);
      rows += `<div class="grp"><span>${esc(c)}</span><span>${n ? '共 ' + n : ''}</span></div>`;
      rows += ps.map((p) => multi
        ? `<div class="row" style="flex-wrap:wrap"><span class="nm" style="flex-basis:100%"><span>${esc(p.name)}</span><small>${p.price === null ? '未定價' : money(p.price)}</small></span><div style="display:flex;flex-wrap:wrap;gap:8px;width:100%">${tg.members.map((m, i) => `<div style="flex:1 1 128px;display:flex;align-items:center;justify-content:space-between;background:var(--paper);border-radius:10px;padding:2px 4px 2px 10px"><small style="color:var(--blue);white-space:nowrap;margin-right:4px">${esc(short(m))}</small>${stepper('reconQ', i + ':' + p.id, f.q[i + ':' + p.id], 1)}</div>`).join('')}</div></div>`
        : `<div class="row"><span class="nm"><span>${esc(p.name)}</span><small>${p.price === null ? '未定價' : money(p.price)}</small></span>${stepper('reconQ', '0:' + p.id, f.q['0:' + p.id])}</div>`).join('');
    });
    const gross = Object.keys(f.q).reduce((t, k) => t + (f.q[k] || 0) * (prod(k.split(':')[1]).price || 0), 0);
    const ours = st.group && st.threshold && gross >= st.threshold && st.rateAfter !== null ? st.rateAfter : st.rate || 0.6;
    const comm = gross * (1 - ours);
    const gnote = multi ? `${esc(tg.label)} 合併成一筆對帳。當月合計滿 ${money(st.threshold)}，整筆改為我方 ${Math.round((st.rateAfter || 0) * 10)} 成。件數依報表填在各店，庫存會從各店分別扣；報表沒分店的話，全部填在其中一家也可以。`
      : st.group ? `${esc(st.group)} 各店合併計算門檻，這裡只用本筆試算，月報會用合併金額重算。` : '每個品項分開記，系統會從這家的寄售庫存逐項扣掉。';
    return head + `<div>${rows}</div>
      <div class="sum"><div class="kv"><span>銷售總額</span><span>${money(gross)}</span></div><div class="kv"><span>對方抽成（我方 ${Math.round(ours * 10)} 成）</span><span>−${money(comm)}</span></div><div class="kv b in-c"><span>應收金額</span><span>${money(gross - comm)}</span></div><span class="lab" style="margin:0">${gnote}</span></div>
      ${dateNote(f, 'recon')}`;
  },
  split(){
    const f = S.F.split;
    const series = [...new Set(byCat('正裝').map((p) => p.series).filter(Boolean))];
    const fulls = byCat('正裝').filter((p) => p.series === f.series);
    const kits = byCat('針管組').filter((p) => p.series === f.series);
    const singles = byCat('單支針管').filter((p) => p.series === f.series);
    const o = (id) => f.open[id] || { bad: 0, good: 0 };
    const opened = fulls.reduce((t, p) => t + o(p.id).bad + o(p.id).good, 0);
    const openedBad = fulls.reduce((t, p) => t + o(p.id).bad, 0);
    const used = kits.reduce((t, p) => t + (f.made[p.id] || 0) * 3, 0) + singles.reduce((t, p) => t + (f.made[p.id] || 0), 0);
    return `<h3>分裝：拆正裝做針管</h3>
      <div class="grid g2">${series.map((s) => chip(f.series === s, 'set', 'split.series|' + s, esc(s), 'sq')).join('')}</div>
      <div class="grp"><span>① 拆了哪些新瓶（瑕疵與良品分開填，展示區的不用填）</span></div>
      ${fulls.map((p) => `<div class="row" style="flex-wrap:wrap"><span class="nm" style="flex-basis:100%"><b style="font-weight:500">${esc(p.name)}</b></span>
        <div style="display:flex;flex-wrap:wrap;gap:8px;width:100%"><div style="flex:1 1 128px;display:flex;align-items:center;justify-content:space-between;background:var(--warnbg);border-radius:10px;padding:2px 4px 2px 10px"><small style="color:var(--warn);white-space:nowrap;margin-right:4px">瑕疵 剩${stockOf('店內', p.id, '瑕疵')}</small>${stepper('openBad', p.id, o(p.id).bad, 1)}</div>
        <div style="flex:1 1 128px;display:flex;align-items:center;justify-content:space-between;background:var(--paper);border-radius:10px;padding:2px 4px 2px 10px"><small style="color:var(--blue);white-space:nowrap;margin-right:4px">良品 剩${stockOf('店內', p.id)}</small>${stepper('openGood', p.id, o(p.id).good, 1)}</div></div></div>`).join('')}
      <div class="grp"><span>② 實際做出多少（自己填）</span></div>
      ${kits.map((p) => `<div class="row"><span class="nm"><span>${esc(p.name)}</span><small>一組 3 支，三款各一</small></span>${stepper('made', p.id, f.made[p.id])}</div>`).join('')}
      ${singles.map((p) => `<div class="row"><span class="nm"><span>${esc(p.name)}</span><small>單支銷售線</small></span>${stepper('made', p.id, f.made[p.id])}</div>`).join('')}
      <div class="hint">展示區的剩香拿來分裝不用記。只有拆新的良品或瑕疵品才記在 ①。拆開的瓶子用不完就當展示瓶，不再記庫存。</div>
      <div class="sum"><div class="kv"><span>拆封正裝</span><span>${opened} 瓶（瑕疵 ${openedBad}）</span></div><div class="kv"><span>裝出的 2ml 針管</span><span>${used} 支</span></div><div class="kv s"><span>參考：拆的瓶數約可裝</span><span>${opened * S.B.perBottle} 支</span></div></div>
      ${dateNote(f, 'split')}`;
  },
  gift(){
    const f = S.F.gift;
    const kinds = ['官網訂單備註贈品', '店內加送', '公關品', '合作品牌', '媒體'];
    return `<h3>贈品・公關品出庫</h3>

function moneyForm(action, title, desc, numbered){
  if (!S.F.monthly) initMonthly();
  const f = S.F.monthly;
  const m = Number(f.date.slice(5, 7));
  const group = MGROUP[action];
  const items = itemsOf(action);
  const row = (x, i) => { const on = !!f.ticks[x.key];
    const due = group === '月初' ? '' : !x.months.length ? (group === '繳費' ? '<span class="tag">每月</span>' : '') : x.months.indexOf(m) > -1 ? '<span class="tag w">本月要繳</span>' : `<span class="tag">${x.months.join('、')} 月繳</span>`;
    const route = x.kind === '轉帳' ? `${x.from} → ${x.to}` : `${x.from} 付出`;
    const changed = num(f.amounts[x.key]) !== num(x.def) ? `・預設 ${money(x.def)}` : '';
    const cap = Math.max(0, x.bal || 0), over = group === '結清' && /待入帳$/.test(x.from) && on ? num(f.amounts[x.key]) - cap : 0;
    const split = over > 0 ? `<div class="hint" style="grid-column:1/-1;margin-top:6px">比待入帳多 ${money(over)}（系統裡還沒進帳的只有 ${money(cap)}）。多出來的通常是開帳日以前訂單的錢，或這筆已經記過。
      <div style="margin-top:6px">${chip(!!(f.split || {})[x.key], 'msplit', x.key, '把多出的 ' + money(over) + ' 記成「期初資金」', 'sq')}</div></div>` : '';
    return `<div class="mi ${on ? 'on' : ''}"><button type="button" class="tick ${on ? 'on' : ''}" data-a="mtick" data-v="${x.key}" aria-label="${on ? '取消' : ''}勾選 ${esc(x.label)}">${on ? '✓' : (numbered ? i + 1 : '')}</button>
      <span class="nm"><b>${esc(x.label)}${due}</b><small>${esc(route)}${changed}</small></span>
      <label><span class="sr">${esc(x.label)} 金額</span><input class="amt" id="m.${x.key}" data-in="m.${x.key}" type="number" inputmode="numeric" value="${esc(f.amounts[x.key])}"></label>${x.note && group !== '繳費' ? `<small class="mnote">${esc(x.note)}</small>` : ''}</div>${split}`; };
  const total = items.filter((x) => f.ticks[x.key]).reduce((t, x) => t + num(f.amounts[x.key]), 0);
  const list = items.map(row).join('');
  return `<h3>${title}</h3><p class="lab" style="margin:0">${desc}</p>
    ${list}
    <div class="kv b" style="border-top:1px solid var(--line);padding-top:8px"><span>勾選合計</span><span>${money(total)}</span></div>
    ${field('monthly.date', '日期', inp('monthly.date', 'date', f.date))}`;
}

const fmt = (n) => Math.round(+n || 0).toLocaleString('en-US');

// 每款：總公升數 − 正裝 ＝ 剩下的液體裝針管；針管先裝同系列針管組（不超過設定組數），多的變單支
function prodCalc(){
  const P = S.P, pa = P.params, q = P.qty, it = P.items, Q = (k) => q[k] || 0;
  const ml = pa['正裝容量（ml）'] || 50, vml = pa['針管容量（ml）'] || 2, kPer = pa['針管組每款支數'] || 1;
  const loss = Math.min(0.9, pa['損耗率'] || 0), extra = pa['物料多叫比例'] || 0;
  const perf = it.filter((x) => x.cat === '正裝'), sets = it.filter((x) => x.cat === '針管組');
  const scent = perf.map((x) => { const total = Q('liters:' + x.id) * 1000, sell = Q('sell:' + x.id), used = sell * ml, remain = total - used;
    return { x, total, sell, used, remain, vials: remain > 0 ? Math.floor(remain / vml) : 0 }; });
  const series = sets.map((k) => { const mem = scent.filter((s) => s.x.series === k.series);
    const max = mem.length ? Math.min(...mem.map((s) => Math.floor(s.vials / kPer))) : 0, want = Q('set:' + k.id);
    return { k, mem, max, want, sets: Math.min(max, want), vps: mem.length * kPer }; });
  scent.forEach((s) => { const g = series.find((x) => x.k.series === s.x.series); s.inSets = g ? g.sets * kPer : 0; s.singles = s.vials - s.inSets; });
  const bottles = scent.reduce((t, s) => t + s.sell, 0), totalMl = scent.reduce((t, s) => t + s.total, 0);
  const nSets = series.reduce((t, s) => t + s.sets, 0), vials = scent.reduce((t, s) => t + s.vials, 0), singles = scent.reduce((t, s) => t + s.singles, 0);
  const units = { '每瓶正裝': bottles, '每組針管': nSets, '每支針管': vials, '整批': 1 };
  const variants = (b) => b.split === '款式' ? scent.map((s) => ({ id: s.x.id, name: s.x.name, u: b.use === '每瓶正裝' ? s.sell : b.use === '每支針管' ? s.vials : b.use === '每組針管' ? (series.find((g) => g.k.series === s.x.series) || { sets: 0 }).sets : 0 }))
    : b.split === '系列' ? series.map((g) => ({ id: g.k.id, name: g.k.name.replace('針管組', ''), u: b.use === '每組針管' ? g.sets : b.use === '每支針管' ? g.mem.reduce((t, s) => t + s.vials, 0) : g.mem.reduce((t, s) => t + s.sell, 0) })) : null;
  const rows = P.bom.map((b) => {
    const off = b.status === '不用叫', whole = b.use === '整批';
    // 待訂＝需要 − 工廠存貨 − 現有庫存 − 已訂
    const vs = !whole && b.split ? variants(b).map((v) => { const need = Math.ceil(b.per * v.u * (1 + extra)), have = num((b.hv || {})[v.id]), stock = num((b.sv || {})[v.id]), ordered = num((b.ov || {})[v.id]);
      return Object.assign(v, { need, have, stock, ordered, todo: Math.max(0, need - have - stock - ordered) }); }) : null;
    const need = whole ? 1 : vs ? vs.reduce((t, v) => t + v.need, 0) : Math.ceil(b.per * (units[b.use] || 0) * (1 + extra));
    const have = whole ? 0 : vs ? vs.reduce((t, v) => t + v.have, 0) : b.have;
    const stock = whole ? 0 : vs ? vs.reduce((t, v) => t + v.stock, 0) : (b.stock || 0);
    const ordered = vs ? vs.reduce((t, v) => t + v.ordered, 0) : b.ordered;
    const todo = off ? 0 : whole ? (ordered >= 1 ? 0 : 1) : vs ? vs.reduce((t, v) => t + v.todo, 0) : Math.max(0, need - have - stock - ordered);
    const done = !off && todo === 0 && need > 0;
    const buy = whole ? 1 : vs ? vs.reduce((t, v) => t + Math.max(0, v.need - v.have - v.stock), 0) : Math.max(0, need - have - stock);   // 要買的總量（已訂＋待訂）
    const budget = off ? 0 : whole ? b.price : buy * b.price;
    const spent = P.purchases.filter((p) => p.bom === b.name).reduce((t, p) => t + p.amount, 0);
    return Object.assign({}, b, { need, have, stock, ordered, todo, done, off, whole, vs, buy, budget, spent });
  });
  const sum = (use) => rows.filter((r) => r.use === use && !r.off).reduce((t, r) => t + r.price * r.per, 0);
  const batchTotal = rows.filter((r) => r.whole && !r.off).reduce((t, r) => t + r.price, 0);
  const perMl = totalMl ? batchTotal / totalMl : 0, keep = 1 - loss;
  const vps = series.length ? series[0].vps : 3;
  const cPerf = (perMl * ml + sum('每瓶正裝')) / keep;
  const cSet = (perMl * vml * vps + sum('每支針管') * vps + sum('每組針管')) / keep;
  const cSingle = (perMl * vml + sum('每支針管')) / keep;
  return { ml, vml, kPer, loss, extra, scent, series, bottles, totalMl, nSets, vials, singles, rows, batchTotal, perMl, vps, cPerf, cSet, cSingle,
    missing: rows.filter((r) => !r.off && !r.price), budget: rows.reduce((t, r) => t + r.budget, 0), spentAll: P.purchases.reduce((t, p) => t + p.amount, 0) };
}

/* ───────── 送出 ───────── */
function payload(){
  const a = S.action, F = S.F;
  if (a === 'sale') { const f = F.sale; const ps = promoState(f); return { action: 'sale', date: f.date, note: f.note, channel: f.channel, account: f.account, coupons: f.coupons || 0, lines: f.cart, gifts: ps ? ps.gifts : [], promo: ps && ps.gifts.length ? ps.pr.name : '', consign: f.channel === '店內' ? f.bc.map((x) => ({ brand: x.brand, price: x.price })) : [] }; }
  if (a === 'gweb') { const f = F.gweb, it = webItem(f.src), amt = num(f.amount), old = showOld() ? f.old : '沒有';
    if (old === '全部都是') return { action: 'transfer', date: f.date, note: f.note, category: '期初資金', to: it.to, amount: amt };
    if (old === '不確定') return { action: 'pending', date: f.date, note: f.note, dir: 'in', amount: amt, account: it.to, desc: (f.src === 'cvs' ? '便利配' : '線上付款') + '撥款，不確定有沒有開帳前的訂單' };
    const oa = old === '有一部分' ? num(f.oldAmt) : 0;
    return { action: 'transfers', date: f.date, items: [{ key: it.key, amount: amt - oa, opening: oa }] }; }
  if (a === 'gpend') { const f = F.gpend; return { action: 'pending', date: f.date, note: f.note, dir: f.dir, amount: f.amount, account: f.account, desc: f.desc }; }
  if (a === 'gbrand') { const f = F.gbrand; return { action: 'transfer', date: f.date, note: f.note, category: '代售貨款支付', from: f.account, amount: f.amount, party: f.brand }; }
  if (a === 'course') { const f = F.course; const auto = coursePrice(S.B.courses.find((x) => x.name === f.course), f.people); return { action: 'course', date: f.date, note: f.note, course: f.course, people: f.people, classDate: f.classDate, amount: f.amount === '' ? auto : f.amount, account: f.account, party: f.party }; }
  if (a === 'expense' && F.expense.scope === '店務' && F.expense.category === '營業稅') { const f = F.expense; return { action: 'transfer', date: f.date, note: f.note, category: '營業稅繳納', from: f.account, to: '', amount: f.amount }; }
  if (a === 'expense') { const f = F.expense; return { action: 'expense', date: f.date, note: f.note, category: f.category, amount: f.amount, account: f.account, party: f.party, batch: f.scope === '店務' ? f.batch : '', bom: f.batch ? f.bom : '' }; }
  if (a === 'collab') { const f = F.collab; return { action: 'collab', date: f.date, eventDate: f.eventDate, note: f.note, kind: f.kind, party: f.party, amount: f.kind === '報名抽成' ? num(f.people) * num(f.per) : f.amount, people: f.people, per: f.per, account: f.account }; }
  if (a === 'consign') { const f = F.consign; return { action: 'consign', date: f.date, note: f.note, brand: f.brand, price: f.price, account: f.account }; }
  if (a === 'send') { const f = F.send; return { action: 'send', date: f.date, note: f.note, store: f.store, lines: Object.keys(f.q).map((id) => ({ id, qty: f.q[id] })) }; }
  if (a === 'recon') { const f = F.recon; const tg = reconTargets().find((x) => x.key === f.store) || { members: [] };
    return f.mode === '收款' ? { action: 'reconPay', date: f.date, note: f.note, store: f.store, salesMonth: f.salesMonth, amount: f.amount, account: f.account }
      : { action: 'recon', date: f.date, note: f.note, store: f.store, salesMonth: f.salesMonth, lines: Object.keys(f.q).map((k) => { const [i, id] = k.split(':'); return { id, qty: f.q[k], store: (tg.members[+i] || {}).name }; }) }; }
  if (a === 'split') { const f = F.split; return { action: 'split', date: f.date, note: f.note, series: f.series, opens: Object.keys(f.open).map((id) => ({ id, bad: f.open[id].bad, good: f.open[id].good, show: f.show[id] || 0 })), made: Object.keys(f.made).map((id) => ({ id, qty: f.made[id] })) }; }
  if (a === 'gift') { const f = F.gift; return { action: 'gift', date: f.date, note: f.note, party: f.party, lines: Object.keys(f.q).map((id) => ({ id, qty: f.q[id] })) }; }
  if (MGROUP[a]) { const f = F.monthly; return { action: 'transfers', date: f.date, items: itemsOf(a).filter((x) => f.ticks[x.key] && num(f.amounts[x.key]) > 0).map((x) => {
    const amt = num(f.amounts[x.key]), cap = Math.max(0, x.bal || 0);
    return (f.split || {})[x.key] && /待入帳$/.test(x.from) && amt > cap ? { key: x.key, amount: cap, opening: amt - cap } : { key: x.key, amount: amt }; }) }; }
  if (a === 'adjust') { const f = F.adjust; return { action: 'adjust', date: f.date, note: f.note, loc: f.loc, state: f.state, lines: Object.keys(f.q).map((id) => ({ id, qty: f.q[id] })) }; }
  if (a === 'transfer') { const f = F.transfer; return { action: 'transfer', date: f.date, note: f.note, category: f.category, from: f.from, to: f.to, amount: f.amount }; }
}
function validate(){
  const a = S.action, F = S.F;
  if (a === 'expense' && !F.expense.category) return '請先選類別';
  if (a === 'gweb') { const f = F.gweb; if (!f.src) return '請選誰撥的款'; if (!(num(f.amount) > 0)) return '請填金額';
    if (showOld() && !f.old) return '請回答有沒有開帳前的訂單';
    if (showOld() && f.old === '有一部分' && !(num(f.oldAmt) > 0 && num(f.oldAmt) < num(f.amount))) return '開帳前訂單的金額要大於 0、小於整筆'; }
  if (a === 'gpend') { const f = F.gpend; if (!(num(f.amount) > 0)) return '請填金額'; if (!String(f.desc).trim()) return '請寫一句這是什麼錢'; if (!f.account) return '請選帳戶'; }
  if (a === 'gbrand') { const f = F.gbrand; if (!f.brand) return '請選品牌'; if (!(num(f.amount) > 0)) return '請填金額'; if (!f.account) return '請選帳戶'; }
  return '';
}
// 送出一筆；遇到「疑似重複」先問，回傳 null＝使用者取消
async function send(tx){
  try { return await api({ action: 'add', tx }); }
  catch (e) { if (String(e.message).indexOf('DUP|') !== 0) throw e;
    if (!confirm(e.message.slice(4))) return null;
    return await api({ action: 'add', tx: Object.assign({}, tx, { force: true }) }); }
}
async function save(){
  if (S.busy) return;
  const err = validate(); if (err) { toast(err); return; }
  S.busy = true; render();
  try {
    const tx = payload();
    const wasEdit = !!S.editing, ctx = S.ctx;
    if (wasEdit) tx.replaceId = S.editing.id;
    const r = await send(tx);
    if (!r) { S.busy = false; render(); return; }
    const back = tx.date && tx.date < new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10) ? '（日期 ' + tx.date.slice(5).replace('-', '/') + '，明細在那天底下）' : '';
    toast(tx.action === 'pending' ? '已記下，Essen 對帳時會看到這筆' : ctx === 'cls' ? '已歸類' : (wasEdit ? '已修改' : '已記下' + (r.result.count > 1 ? ' ' + r.result.count + ' 筆' : '')) + back);
    const keep = S.action;
    if (tx.batch || S.page === 'prod') S.P = null;
    if (ctx) { S.editing = null; S.action = ''; S.anchor = ''; S.cls = null; S.ctx = ''; if (ctx === 'g') { S.page = ''; window.scrollTo(0, 0); } S.issuesMonth = ''; }
    else if (wasEdit) { S.editing = null; S.action = ''; S.tab = 'list'; S.openEntry = ''; }
    await boot(true);
    initForms(); if (MGROUP[keep]) S.F.monthly = null;
    S.items = null; S.summary = null;
  } catch(e){ toast(e.message); }
  S.busy = false; render();
}

/* ───────── 修改：把原紀錄帶回表單 ───────── */
const qOf = (ls) => { const q = {}; (ls || []).forEach((l) => { q[l.id] = (q[l.id] || 0) + l.qty; }); return q; };
function prefillable(t){ return ['商品銷售','課程收款','品牌合作','代售','支出','寄售送貨','寄售對帳','寄售收款','分裝','公關出庫','庫存調整','轉帳','月初分錢'].indexOf(t.action) > -1; }
function prefill(t){
  if (!prefillable(t)) return false;
  initForms();
  const d = t.d || {}, F = S.F;
  const base = { date: t.date, note: t.note || '' };
  switch (t.action) {
    case '商品銷售': {
      const picks = []; (d.gifts || []).forEach((g) => { for (let i = 0; i < g.qty; i++) picks.push(g.id); });
      const first = prod((d.lines || [{}])[0].id);
      Object.assign(F.sale, base, { channel: d.channel || '店內', account: t.to, cart: (d.lines || []).map((l) => ({ id: l.id, qty: l.qty })), picks, coupons: d.coupons || 0, cat: first.cat || '正裝' });
      S.action = 'sale'; break;
    }
    case '課程收款': Object.assign(F.course, base, { course: d.course, people: d.people || 1, classDate: d.classDate || '', amount: t.amount, account: t.to, party: t.party }); S.action = 'course'; break;
    case '品牌合作': Object.assign(F.collab, base, { kind: t.category, eventDate: d.eventDate || '', people: d.people || '', per: d.per || '', party: t.party, amount: t.amount, account: t.to }); S.action = 'collab'; break;
    case '代售': Object.assign(F.consign, base, { brand: t.party, price: t.amount, account: t.to }); S.action = 'consign'; break;
    case '支出': Object.assign(F.expense, base, { scope: t.scope === '個人' ? '個人' : '店務', category: t.category, amount: t.amount, account: t.from, party: t.party, batch: (t.d || {}).batch || '', bom: (t.d || {}).bom || '' }); S.action = 'expense'; break;
    case '寄售送貨': Object.assign(F.send, base, { store: t.party, q: qOf(d.lines) }); S.action = 'send'; break;
    case '寄售對帳': {
      const key = d.group ? 'G:' + d.group : t.party;
      const tg = reconTargets().find((x) => x.key === key) || { members: [] };
      const q = {}; (d.lines || []).forEach((l) => { const i = Math.max(0, tg.members.findIndex((m) => m.name === l.store)); q[i + ':' + l.id] = (q[i + ':' + l.id] || 0) + l.qty; });
      Object.assign(F.recon, base, { mode: '對帳', store: key, salesMonth: t.rec, q }); S.action = 'recon'; break;
    }
    case '寄售收款': { const isG = reconTargets().some((x) => x.key === 'G:' + t.party); Object.assign(F.recon, base, { mode: '收款', store: isG ? 'G:' + t.party : t.party, salesMonth: t.rec, amount: t.amount, account: t.to }); S.action = 'recon'; break; }
    case '分裝': {
      const open = {}, show = {}; (d.opens || []).forEach((o) => { open[o.id] = { bad: o.bad, good: o.good }; if (o.show) show[o.id] = o.show; });
      Object.assign(F.split, base, { series: t.party, open, show, made: qOf(d.made) }); S.action = 'split'; break;
    }
    case '公關出庫': Object.assign(F.gift, base, { party: t.party, q: qOf(d.lines) }); S.action = 'gift'; break;
    case '庫存調整': { const [loc, state] = String(t.party).split('・'); Object.assign(F.adjust, base, { loc, state: state || '良品', q: qOf(d.lines) }); S.action = 'adjust'; break; }
    default: // 轉帳、月初分錢的單筆
      if (t.flow === '支出') { Object.assign(F.expense, base, { scope: t.scope === '個人' ? '個人' : '店務', category: t.category, amount: t.amount, account: t.from, party: t.party }); S.action = 'expense'; }
      else if (t.flow === '付款' && t.category === '營業稅繳納') { Object.assign(F.expense, base, { scope: '店務', category: '營業稅', amount: t.amount, account: t.from, party: '' }); S.action = 'expense'; }
      else if (t.flow === '付款') { Object.assign(F.transfer, base, { category: '代售貨款支付', from: t.from, to: '', amount: t.amount }); S.action = 'transfer'; }
      else { Object.assign(F.transfer, base, { category: t.category, from: t.from, to: t.to, amount: t.amount }); S.action = 'transfer'; }
  }
  return true;
}

/* ───────── 明細 ───────── */
function entryText(t){
  const d = t.d || {};
  const lines = (ls) => (ls || []).map((l) => l.name.replace('・單支', '（單支）') + '×' + l.qty).join('、');
  switch (t.action) {
    case '商品銷售': return { title: lines(d.lines), sub: (d.channel === '官網' ? '官網・' : '店內・') + t.to + (d.coupons ? '・折抵券 ×' + d.coupons : '') + (d.gifts && d.gifts.length ? '・贈 ' + lines(d.gifts) : ''), amt: '+' + money(t.amount), c: 'in-c' };
    case '課程收款': return { title: d.course, sub: d.people + ' 人・上課 ' + d.classDate + '・' + t.to, amt: '+' + money(t.amount), c: 'in-c' };
    case '品牌合作': return { title: '品牌合作・' + t.category + (t.party ? '・' + t.party : ''), sub: (d.eventDate ? '活動 ' + d.eventDate + '・' : '') + '收進 ' + t.to, amt: '+' + money(t.amount), c: 'in-c' };
    case '代售': return { title: t.party + ' 代售', sub: '店的收入 ' + money((d.shop || 0) + (d.tax || 0)) + '・應付品牌 ' + money(d.brand), amt: '+' + money(t.amount), c: 'in-c' };
    case '支出': return { title: t.category + ((t.d || {}).batch ? '・第二批' : ''), sub: (t.scope === '個人' ? '個人・' : '') + t.from + (t.party ? '・' + t.party : '') + ((t.d || {}).bom ? '・' + t.d.bom : ''), amt: '−' + money(t.amount), c: 'out-c' };
    case '寄售送貨': return { title: '送貨到 ' + t.party, sub: lines(d.lines), amt: '庫存', c: '' };
    case '寄售對帳': return { title: t.party + ' 對帳（' + t.rec + '）', sub: d.group ? (d.lines || []).map((l) => l.store.replace(d.group, '').trim() + '・' + l.name + '×' + l.qty).join('、') : lines(d.lines), amt: money(t.amount), c: '' };
    case '寄售收款': return { title: t.party + ' 收款', sub: t.rec + ' 的款項・' + t.to, amt: '+' + money(t.amount), c: 'in-c' };
    case '分裝': return { title: t.party + ' 分裝', sub: '拆 ' + (d.opens || []).reduce((a, o) => a + o.bad + o.good, 0) + ' 瓶・做出 ' + lines(d.made), amt: '庫存', c: '' };
    case '公關出庫': return { title: '贈品・公關品：' + t.party, sub: lines(d.lines), amt: '庫存', c: '' };
    case '待確認': return { title: '待確認：' + t.party, sub: (d.dir === 'out' ? '從 ' + t.from : '進 ' + t.to) + '・等 Essen 歸類', amt: (d.dir === 'out' ? '−' : '+') + money(t.amount), c: '' };
    case '庫存調整': return { title: '庫存調整・' + t.party, sub: (d.lines || []).map((l) => l.name + (l.qty > 0 ? '+' : '') + l.qty).join('、'), amt: '庫存', c: '' };
    default: return { title: t.party || t.category, sub: t.flow === '轉帳' ? t.from + ' → ' + t.to : (t.from || t.to), amt: (t.flow === '支出' || t.flow === '付款' ? '−' : t.flow === '收入' ? '+' : '') + money(t.amount), c: t.flow === '支出' || t.flow === '付款' ? 'out-c' : t.flow === '收入' ? 'in-c' : '' };
  }
}

function setPath(path, val){
  const [form, key] = path.split('.');
  if (form === 'm') { S.F.monthly.amounts[key] = val === '' ? '' : Number(val); return; }
  if (form === 'monthly') { S.F.monthly[key] = val; return; }
  if (form === 'cls') { S.cls[key] = val; return; }
  if (form === 'bd') { if (key.indexOf('h_') === 0) { S.bd.hv = Object.assign({}, S.bd.hv || {}); S.bd.hv[key.slice(2)] = num(val); return; }
    if (key.indexOf('o_') === 0) { S.bd.ov = Object.assign({}, S.bd.ov || {}); S.bd.ov[key.slice(2)] = num(val); return; } S.bd[key] = val; return; }
  if (form === 'ord') { if (key.indexOf('o_') === 0) { S.ord.qv[key.slice(2)] = num(val); return; } S.ord[key] = key === 'payNow' ? val === '1' : val; return; }
  if (form === 'tr') { S.tr[key] = val; return; }
  if (form === 'pay') { S.pay[key] = val; return; }
  const f = S.F[form]; if (!f) return;
  if (['people'].indexOf(key) > -1) val = Number(val);
  if (form === 'sale' && key === 'cat') { f.cat = val; return; }
  if (form === 'sale' && key === 'channel') { f.channel = val; f.account = val === '官網' ? '線上付款待入帳' : '店內現金'; if (val === '官網' && f.cat === '寄賣品牌') f.cat = '正裝'; return; }
  if (form === 'expense' && key === 'oth') { f.oth = true; if (['全家', '萊爾富', '郵局', '黑貓'].indexOf(f.party) > -1) f.party = ''; return; }
  if (form === 'expense' && key === 'category') { f.category = val; if (f.scope === '店務') {
      if (S.B.paused) { if (['稅金預留', '固定支出預留'].indexOf(f.account) > -1) f.account = S.B.mainAcc; }
      else if (val === '營業稅') f.account = '稅金預留'; else if (FIXED_BILLS.indexOf(val) > -1) f.account = '固定支出預留';
      else if (['稅金預留', '固定支出預留'].indexOf(f.account) > -1) f.account = '公司營運戶'; } return; }
  if (form === 'expense' && key === 'scope') { f.scope = val; f.category = val === '店務' ? '運費' : '餐飲'; f.account = val === '店務' ? '公司營運戶' : '個人帳戶'; return; }
  if (form === 'course' && (key === 'course' || key === 'people')) f.amount = '';
  if (form === 'split' && key === 'series') { f.open = {}; f.made = {}; f.show = {}; }
  f[key] = val;
}

  tCancel(){ S.tEdit = null; render(); },
  async tSave(){ const isNew = String(S.tEdit).indexOf('new:') === 0;
    const body = isNew ? { action: 'task', area: S.tEdit.slice(4), title: S.tr.title, desc: S.tr.desc } : { action: 'task', id: S.tEdit, status: S.tr.status, result: S.tr.result };
    if (isNew && !String(S.tr.title || '').trim()) return toast('請填項目');
    S.busy = true; render();
    try { const d = await api(body); S.B.tasks = d.tasks; if (S.P) S.P.tasks = d.tasks; S.tEdit = null; toast('已存'); } catch(e){ toast(e.message); } S.busy = false; render(); },
  role(v){ S.role = v; LS.set('ledger.role', v); S.page = ''; S.action = ''; S.ctx = ''; render(); },
  set(v){ const i = v.indexOf('|'); setPath(v.slice(0, i), v.slice(i + 1)); render(); },
  // 用位置選，不用名稱比對：名稱裡有隱藏換行時也不會選不到
  pickIdx(v){ const [path, list, i] = v.split('|'); const item = (S.B[list] || [])[+i]; if (item) setPath(path, item.name); render(); },
  coupon(v){ const d = +v.split('|')[1]; const f = S.F.sale; f.coupons = Math.max(0, (f.coupons || 0) + d); render(); },
  saleAdd(id){ const c = S.F.sale.cart; const l = c.find((x) => x.id === id); if (l) l.qty++; else c.push({ id, qty: 1 }); render(); },
  saleQty(v){ const [id, d] = v.split('|'); const c = S.F.sale.cart; const l = c.find((x) => x.id === id); if (l) { l.qty += +d; if (l.qty <= 0) c.splice(c.indexOf(l), 1); } render(); },
  pick(v){ const [i, id] = v.split('|'); const p = S.F.sale.picks; if (p[i] === id) p[i] = ''; else if (!S.editing && stockOf('店內', id) <= 0) { toast(prod(id).name + ' 目前沒有庫存'); return; } else p[i] = id; render(); },
  sendQ(v){ const [id, d] = v.split('|'); bump(S.F.send.q, id, +d); render(); },
  reconQ(v){ const [id, d] = v.split('|'); bump(S.F.recon.q, id, +d); render(); },
  reconT(i){ const tg = reconTargets()[+i]; if (tg && tg.key !== S.F.recon.store) { S.F.recon.store = tg.key; S.F.recon.q = {}; } render(); },
  giftQ(v){ const [id, d] = v.split('|'); bump(S.F.gift.q, id, +d); render(); },
  openBad(v){ const [id, d] = v.split('|'); const o = S.F.split.open[id] || (S.F.split.open[id] = { bad: 0, good: 0 }); o.bad = Math.max(0, Math.min(S.editing ? 999 : stockOf('店內', id, '瑕疵'), o.bad + +d)); render(); },
  openGood(v){ const [id, d] = v.split('|'); const o = S.F.split.open[id] || (S.F.split.open[id] = { bad: 0, good: 0 }); o.good = Math.max(0, Math.min(S.editing ? 999 : stockOf('店內', id), o.good + +d)); render(); },
  made(v){ const [id, d] = v.split('|'); bump(S.F.split.made, id, +d); render(); },
  adjQ(v){ const [id, d] = v.split('|'); const q = S.F.adjust.q; q[id] = (q[id] || 0) + +d; if (!q[id]) delete q[id]; render(); },
  show(v){ const [id, d] = v.split('|'); const o = S.F.split.open[id] || { bad: 0, good: 0 }; S.F.split.show[id] = Math.max(0, Math.min(o.bad + o.good, (S.F.split.show[id] || 0) + +d)); render(); },
  mtick(k){ S.F.monthly.ticks[k] = !S.F.monthly.ticks[k]; render(); },
  save(){ save(); },
  lo(v){ S.listOrder = v; render(); },
  msplit(k){ const f = S.F.monthly; f.split = f.split || {}; f.split[k] = !f.split[k]; render(); },
  async ack(i){ const x = (S.issues || [])[+i]; if (!x) return; const done = !x.done; x.done = done; x.by = done ? S.user : ''; render();
    try { await api({ action: 'ack', key: x.key, done, title: x.title }); } catch(e){ x.done = !done; toast(e.message); render(); } },
  ackOpen(){ S.ackOpen = !S.ackOpen; render(); },
  sv0(){ S.showVoid = !S.showVoid; render(); },
  lm(d){ S.listMonth = addMonth(S.listMonth, +d); S.items = null; render(); },
  rm(d){ S.month = addMonth(S.month, +d); S.summary = null; render(); },
  sv(v){ S.stockView = +v; render(); },
  hist(v){ if (!v || (S.hist && S.hist.id === v)) { S.hist = null; render(); return; } S.hist = { id: v }; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    api({ action: 'history', item: v }).then((r) => { if (S.hist && S.hist.id === v) { S.hist.items = r.items || []; render(); } }).catch((e) => toast(e.message)); },
  async refresh(){ await boot(true); toast('已更新'); render(); },
  openEnt(id){ S.openEntry = S.openEntry === id ? '' : id; render(); },
  editEnt(id){
    const t = (S.items || []).find((x) => x.id === id); if (!t) return;
    if (!prefill(t)) { toast('這類紀錄請作廢後重記'); return; }
    S.editing = { id: t.id, title: entryText(t).title, date: t.date };
    S.ctx = ''; S.anchor = ''; S.page = '';
    S.tab = 'add'; render(); window.scrollTo(0, 0);
  },
  cancelEdit(){ S.editing = null; S.action = ''; initForms(); render(); },
  async void(id){
    const t = (S.items || []).find((x) => x.id === id); if (!t || t.status === '作廢') return;
    if (!confirm('作廢這筆？\n' + entryText(t).title + '\n\n作廢後會保留在試算表，但不計入報表，庫存也會還原。')) return;
    try { await api({ action: 'void', id }); toast('已作廢'); S.items = null; S.openEntry = ''; await boot(true); } catch(e){ toast(e.message); }
    render();
  },
  async login(){
    S.url = $('#cfg\\.url').value.trim(); S.user = $('#cfg\\.user').value.trim(); S.pin = $('#cfg\\.pin').value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(S.url)) return toast('網址格式不對，應以 /exec 結尾');
    try { await boot(); LS.set('isl_url', S.url); LS.set('isl_user', S.user); LS.set('isl_pin', S.pin); toast('連線成功'); S.tab = 'add'; render(); } catch(e){ toast(e.message); }
  },
  logout(){ if (!confirm('清除這台裝置上的連線設定？')) return; ['isl_url', 'isl_user', 'isl_pin'].forEach(LS.del); S.url = S.user = S.pin = ''; S.B = null; render(); }
};
document.addEventListener('click', (e) => { const el = e.target.closest('[data-a]'); if (!el) return; const fn = H[el.dataset.a]; if (fn) fn(el.dataset.v); });
// 打字時只在需要即時試算的欄位重畫，避免手機鍵盤跳動
const LIVE = (id) => id.indexOf('m.') === 0 || id.indexOf('ord.o_') === 0 || id === 'ord.q' || ['consign.price', 'recon.amount', 'collab.people', 'collab.per', 'gweb.amount', 'gweb.oldAmt', 'cls.old'].indexOf(id) > -1;
// 日期欄位不重畫整頁：iPhone 的日期選擇器開著時重畫，會讓選擇器失效、改不了日期
function onDate(el){ setPath(el.dataset.in, el.value); const n = document.getElementById('course-note'); if (n && S.F.course) n.textContent = courseNote(S.F.course); const c = document.getElementById('collab-note'); if (c && S.F.collab) c.textContent = collabNote(S.F.collab); }
document.addEventListener('input', (e) => { const el = e.target; if (!el.dataset || !el.dataset.in) return; if (el.type === 'date') return onDate(el); setPath(el.dataset.in, el.value); if (LIVE(el.dataset.in)) render(); });
document.addEventListener('focusout', (e) => { if (!S.pDirty) return; const r = e.relatedTarget; if (r && r.classList && r.classList.contains('pin')) return; S.pDirty = false; setTimeout(render, 0); });
document.addEventListener('change', (e) => { const el = e.target; if (el.dataset && el.dataset.in && el.type === 'date') onDate(el);
  if (el.dataset && el.dataset.bf) {   // 物料數量：工廠存貨、現有庫存、已訂
    const [row, f, vid] = el.dataset.bf.split('|'); const b = S.P.bom.find((x) => String(x.row) === row); if (!b) return;
    const map = { have: 'hv', stock: 'sv', ordered: 'ov' }, val = num(el.value);
    if (vid) { b[map[f]] = Object.assign({}, b[map[f]] || {}); b[map[f]][vid] = val; } else b[f] = val;
    setTimeout(() => { const a = document.activeElement; if (a && a.classList && a.classList.contains('pin')) S.pDirty = true; else render(); }, 0);
    api({ action: 'prodSet', kind: 'bom', row: b.row, bom: b }).then(() => toast('已存')).catch((er) => toast(er.message));
    return;
  }
  if (el.dataset && el.dataset.bp) {   // 物料單價／整批總價：直接在清單上填
    const b = S.P.bom.find((x) => String(x.row) === el.dataset.bp); if (!b) return;
    b.price = num(el.value);
    setTimeout(() => { const a = document.activeElement; if (a && a.classList && a.classList.contains('pin')) S.pDirty = true; else render(); }, 0);
    api({ action: 'prodSet', kind: 'bom', row: b.row, bom: b }).then(() => toast('已存')).catch((er) => toast(er.message));
    return;
  }
  if (el.dataset && (el.dataset.pq || el.dataset.pp)) {   // 第二批：數量、參數改完就存
    const key = el.dataset.pq || el.dataset.pp, val = num(el.value);
    if (el.dataset.pq) S.P.qty[key] = val; else S.P.params[key] = val;
    // 使用者正在跳到下一格時先不重畫，免得剛點的格子被換掉
    setTimeout(() => { const a = document.activeElement; if (a && a.classList && a.classList.contains('pin')) S.pDirty = true; else render(); }, 0);
    api({ action: 'prodSet', kind: 'plan', key, value: val }).then(() => toast('已存')).catch((er) => toast(er.message));
  } });

async function boot(keepForms){
  const d = await api({ action: 'bootstrap' });
  S.B = d;
  if (!keepForms || !S.F.sale) initForms();
  if (!S.month) S.month = d.month;
  if (!S.listMonth) S.listMonth = d.month;
}
(async function(){
  render();
  if (!S.url || !S.user || !S.pin) { S.tab = 'set'; render(); return; }
  try { await boot(); render(); } catch(e){ toast(e.message); S.tab = 'set'; render(); }
})();
</script>
</body>
