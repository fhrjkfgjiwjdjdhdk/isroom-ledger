<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="遺室帳本">
<title>遺室帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{--deep:#172E4D;--blue:#23507D;--teal:#2F7E95;--ink:#13233A;--sub:#4E5F72;--line:#CFDAE3;--paper:#EAF0F4;--card:#FFFFFF;--pale:#DCE7F0;--in:#1D6B57;--out:#9A4A1C;--warnbg:#FBF1DC;--warn:#6E4700}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;overflow-x:clip;overscroll-behavior-x:none;touch-action:pan-y;-webkit-text-size-adjust:100%;background:var(--paper);color:var(--ink);font:15px/1.5 'Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:var(--deep);color:#fff;border-bottom:4px solid var(--teal)}
.hd{max-width:560px;margin:0 auto;padding:14px 16px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-family:'Noto Serif TC',serif;font-size:20px;letter-spacing:.2em}
.hd small{color:#C9D8E6;font-size:13px}
.gear{background:none;border:1px solid #4A6688;color:#fff;border-radius:10px;min-height:36px;padding:0 12px;font-size:13px}
main{max-width:560px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:none;min-height:62px;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
nav button i{width:24px;height:3px;border-radius:2px;background:transparent}
nav button.on{color:var(--deep);font-weight:700}nav button.on i{background:var(--teal)}
h2{margin:0;font-size:17px}
h3{margin:0;font-size:16px}
.lab{font-size:12px;color:var(--sub);margin:0 0 6px}
.sec{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:8px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{min-height:64px;border-radius:14px;padding:10px 14px;text-align:left;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;justify-content:center}
.tile b{font-size:16px}.tile span{font-size:12px;opacity:.8}
.tile.on{background:var(--deep);border-color:var(--deep);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px}
.chip.sq{border-radius:12px;min-height:44px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.off{background:#F4F6F8;color:#8795A3;border-style:dashed}
.chip small{opacity:.7;font-size:12px;margin-left:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;border-bottom:1px solid #EEF2F5}
.row:last-child{border-bottom:0}
.row .nm{display:flex;flex-direction:column;min-width:0;flex:1}.row .nm small{font-size:11px;color:var(--sub)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px}
.step.sm{gap:2px}.step.sm button{width:32px;height:36px;font-size:16px}.step.sm b{min-width:22px;font-size:15px}
.step b{min-width:24px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.grp{font-size:12px;color:var(--sub);border-bottom:1px solid var(--line);padding-bottom:4px;display:flex;justify-content:space-between;margin-top:6px}
input[type=number],input[type=text],input[type=date],input[type=password],input[type=url],select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;font-size:16px}
input.big{font-size:24px;font-weight:700;text-align:right;min-height:52px;font-variant-numeric:tabular-nums}
input.amt{width:104px;text-align:right;font-variant-numeric:tabular-nums}
.sum{background:var(--paper);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv.b{font-weight:700;font-size:15px}.kv.s{font-size:12px;color:var(--sub)}.kv.ind{padding-left:12px;font-size:13px;color:var(--sub)}
.pl{display:flex;flex-direction:column;gap:8px;font-variant-numeric:tabular-nums}
.pl .blk{display:flex;flex-direction:column;gap:3px}
.pl .grp{background:var(--paper);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:3px}
.pl .grp .kv+.kv.minus{margin-top:6px}
.pl .res{background:var(--pale);border-left:4px solid var(--deep);border-radius:6px;padding:8px 12px}
.pl .res .kv{font-weight:700;font-size:16px}
.pl .res.neg{background:var(--warnbg);border-left-color:var(--out)}
.kv.minus{font-size:14px}.pl .kv span:last-child{white-space:nowrap}.fx{font-size:12px;color:var(--sub);margin-top:2px;text-align:right}.kv.det{padding-left:18px;font-size:12px;color:var(--sub)}.kv.det span:first-child::before{content:'其中 '}
.kv.tot{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;font-weight:700;font-size:15px}
.in-c{color:var(--in)}.out-c{color:var(--out)}
.hint{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6}
.promo{background:#F2F6F9;border:1px solid var(--teal);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.promo .t{font-size:11px;font-weight:700;color:var(--teal);letter-spacing:.08em}
.save{min-height:52px;border:0;border-radius:14px;background:var(--deep);color:#fff;font-size:16px;font-weight:700;letter-spacing:.1em}
.save:disabled{opacity:.5}
.ghost{min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff}
.tick{width:32px;height:32px;flex:none;border-radius:8px;border:1px solid #A9BBCB;background:#fff;color:var(--sub);font-size:13px;font-weight:700}
.tick.on{background:var(--blue);border-color:var(--blue);color:#fff}
.mi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#fff;border:1px solid #EEF2F5}
.mi{flex-wrap:wrap}.mnote{flex-basis:100%;padding:2px 0 0 42px;font-size:11px;line-height:1.6;color:var(--sub)}
.mi.on{background:#F2F6F9}.mi:not(.on){opacity:.8}
.mi .nm{flex:1;min-width:0;display:flex;flex-direction:column}.mi .nm small{font-size:11px;color:var(--sub)}
.tag{display:inline-block;font-size:11px;font-weight:500;border-radius:4px;padding:1px 6px;margin-left:4px;background:var(--pale);color:var(--blue);vertical-align:1px}
.tag.w{background:var(--warnbg);color:var(--warn)}
.ent{width:100%;min-height:60px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;margin-bottom:6px}
.ent .nm{display:flex;flex-direction:column;min-width:0}.ent b{font-size:15px}.ent small{font-size:12px;color:var(--sub)}
.ent .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ent.void{opacity:.45}.ent.void .a{text-decoration:line-through}
.day{font-size:12px;color:var(--sub);margin:12px 0 6px}
.mon{display:flex;align-items:center;gap:6px}.mon button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff}
.mon span{min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:999px;background:var(--pale);overflow:hidden}.bar i{display:block;height:12px;background:var(--teal)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.kpi span{font-size:11px;color:var(--sub)}.kpi b{font-size:20px;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;z-index:20}
#toast.show{opacity:1}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.grid>*,.row>*,.kv>*,.mi>*,.ent>*,.sum,.card,label{min-width:0}
.kv span:first-child,.row .nm,.mi .nm,.ent .nm{overflow-wrap:anywhere}
.kv span:last-child{text-align:right}
main,.card{overflow-wrap:anywhere}
input,select{max-width:100%;min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;height:44px;line-height:44px;-webkit-min-logical-width:calc(100% - 26px)}
input[type=date]::-webkit-date-and-time-value{min-height:1.5em}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.is{display:grid;grid-template-columns:minmax(0,1fr) 36px 36px 36px 44px;gap:4px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums;padding:5px 0;border-bottom:1px solid #EEF2F5}
.is>span:not(:first-child){text-align:right}.is.h{font-size:11px;color:var(--sub);border-bottom:1px solid var(--line)}.is.t{font-weight:700;border-bottom:0}
.is .z{color:#A9B6C3}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header><div class="hd">
  <div><h1>遺室帳本</h1><small id="who"></small></div>
  <button class="gear" data-a="tab" data-v="set">設定</button>
</div></header>
<main id="app"></main>
<nav><div class="in" id="nav"></div></nav>
<div id="toast" role="status"></div>

<script>
/* ───────── 狀態 ───────── */
const LS = {
  get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const S = {
  url: LS.get('isl_url'), user: LS.get('isl_user'), pin: LS.get('isl_pin'),
  B: null, tab: 'add', action: '', busy: false, editing: null, openEntry: '', month: '', listMonth: '', items: null, summary: null, stockView: 0,
  F: {}
};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n) => (n < 0 ? '−' : '') + '$' + Math.abs(Math.round(n || 0)).toLocaleString('en-US');
const num = (v) => { const n = Number(v); return isFinite(n) ? n : 0; };
let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }

async function api(body){
  if (!S.url || !S.user || !S.pin) throw new Error('請先到「設定」填入連線資料');
  const res = await fetch(S.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({}, body, { user: S.user, pin: S.pin })) });
  let d; try { d = await res.json(); } catch(e){ throw new Error('連線失敗，請確認 API 網址與部署授權'); }
  if (d.error) throw new Error(d.error);
  return d;
}

/* ───────── 資料工具 ───────── */
const P = () => S.B.products;
const prod = (id) => P().find((p) => p.id === id) || { id, name: id, cat: '', price: null };
const byCat = (c) => P().filter((p) => p.cat === c);
const stockOf = (loc, id, state) => { const r = S.B.stock.find((x) => x.loc === loc && x.item === id && x.state === (state || '良品')); return r ? r.qty : 0; };
const today = () => S.B ? S.B.today : new Date().toISOString().slice(0,10);
const curMonth = () => today().slice(0,7);
const addMonth = (m, d) => { const [y, mm] = m.split('-').map(Number); const x = new Date(y, mm - 1 + d, 1); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0'); };
const accounts = (scope) => S.B.accounts.filter((a) => !scope || a.scope === scope);
const accScope = (n) => (S.B.accounts.find((a) => a.name === n) || {}).scope;

function initForms(){
  const t = today();
  S.F = {
    sale: { cat: '正裝', channel: '店內', account: '店內現金', cart: [], picks: [], date: t, note: '' },
    course: { course: (S.B.courses[0] || {}).name || '', people: 1, classDate: '', amount: '', account: '公司營運戶', party: '', date: t, note: '' },
    expense: { scope: '店務', category: '運費', amount: '', account: '公司營運戶', party: '', date: t, note: '' },
    consign: { brand: (S.B.brands[0] || {}).name || '', price: '', account: '店內現金', date: t, note: '' },
    send: { store: (S.B.stores[0] || {}).name || '', q: {}, date: t, note: '' },
    recon: { mode: '對帳', store: (reconTargets()[0] || {}).key || '', salesMonth: addMonth(curMonth(), -1), q: {}, amount: '', account: '公司營運戶', date: t, note: '' },
    split: { series: '第二系列', open: {}, made: {}, show: {}, date: t, note: '' },
    gift: { q: {}, party: '', date: t, note: '' },
    monthly: null,
    transfer: { category: '帳戶間轉帳', from: '店內現金', to: '公司營運戶', amount: '', date: t, note: '' },
    adjust: { loc: (S.B.stores[0] || {}).name || '店內', state: '良品', q: {}, date: t, note: '' }
  };
}
function initMonthly(){
  const m = Number(today().slice(5,7));
  const amounts = {}, ticks = {};
  S.B.monthItems.forEach((x) => {
    amounts[x.key] = x.def;
    ticks[x.key] = x.group === '月初' ? true : x.group === '繳費' ? (!x.months.length || x.months.indexOf(m) > -1) : false;
  });
  S.F.monthly = { amounts, ticks, date: today() };
}

/* ───────── 活動（讀試算表「活動」表） ───────── */
function activePromo(channel){
  const d = today();
  return S.B.promos.find((p) => p.start <= d && d <= p.end && (p.channel === '全部' || p.channel === channel)) || null;
}
function promoState(f){
  const pr = activePromo(f.channel);
  if (!pr) return null;
  const hits = f.cart.filter((l) => { const p = prod(l.id); return (!pr.cat || pr.cat === '任一商品' || p.cat === pr.cat) && (!pr.item || pr.item === p.id || pr.item === p.name); });
  const qty = hits.reduce((t, l) => t + l.qty, 0);
  const amt = hits.reduce((t, l) => t + (prod(l.id).price || 0) * l.qty, 0);
  let slots = 0;
  if (pr.minAmt > 0) slots = amt >= pr.minAmt ? (pr.repeat ? Math.floor(amt / pr.minAmt) : 1) : 0;
  else { const mq = pr.minQty || 1; slots = qty >= mq ? (pr.repeat ? Math.floor(qty / mq) : 1) : 0; }
  if (!slots) return { pr, slots: 0, gifts: [] };
  let gifts = [];
  if (pr.mode === '全部送') gifts = pr.options.map((id) => ({ id, qty: pr.perQty * slots }));
  else if (pr.mode === '同款香') {
    let left = slots;
    hits.forEach((l) => { const base = prod(l.id).name; const opt = pr.options.find((id) => prod(id).name.indexOf(base) === 0); const n = Math.min(left, l.qty); if (opt && n > 0) { gifts.push({ id: opt, qty: n * pr.perQty }); left -= n; } });
  } else {
    f.picks.slice(0, slots).forEach((id) => { if (id) gifts.push({ id, qty: pr.perQty }); });
  }
  const agg = {}; gifts.forEach((g) => { agg[g.id] = (agg[g.id] || 0) + g.qty; });
  return { pr, slots, gifts: Object.keys(agg).map((id) => ({ id, qty: agg[id] })) };
}

/* ───────── 課程計價（與預約系統相同的算法） ───────── */
function coursePrice(c, n){
  if (!c) return null;
  const p1 = c.prices[0]; if (p1 === null) return null;
  const combos = {}; [2,3,4].forEach((k) => { if (c.prices[k-1] !== null) combos[k] = c.prices[k-1]; });
  if (combos[n]) return combos[n];
  let best = n * p1;
  Object.keys(combos).forEach((k) => { const cnt = +k; const total = combos[k] + (n - cnt) * p1; if (cnt < n && total < best) best = total; });
  return best;
}

function courseNote(f){
  const rec = f.classDate ? f.classDate.slice(0, 7) : '';
  return !f.classDate ? '請選上課日期' : rec > f.date.slice(0, 7) ? `上課在 ${rec}：錢今天進帳戶，但先算「預收課程款」，上完課那個月才算收入。學員取消時要退。` : `上課在 ${rec}：算 ${rec} 的收入。`;
}

// 對帳對象：同一個「合併群組」的寄售點合成一個（例如 ASA 桃園＋台中，合併報表、一起匯款）
function reconTargets(){
  const out = [], seen = {};
  S.B.stores.forEach((st) => {
    if (st.group) {
      if (seen[st.group]) return; seen[st.group] = 1;
      const members = S.B.stores.filter((x) => x.group === st.group);
      out.push({ key: 'G:' + st.group, group: st.group, label: st.group + '（' + members.map((x) => x.name.replace(st.group, '').trim()).join('＋') + '）', members, cfg: st });
    } else out.push({ key: st.name, group: '', label: st.name, members: [st], cfg: st });
  });
  return out;
}

/* ───────── 畫面：共用小元件 ───────── */
const chip = (on, a, v, label, extra) => `<button type="button" class="chip ${extra || ''} ${on ? 'on' : ''}" data-a="${a}" data-v="${esc(v)}">${label}</button>`;
const stepper = (a, v, val, sm) => `<div class="step${sm ? ' sm' : ''}"><button type="button" data-a="${a}" data-v="${esc(v)}|-1" aria-label="減少">−</button><b>${val || 0}</b><button type="button" data-a="${a}" data-v="${esc(v)}|1" aria-label="增加">+</button></div>`;
const field = (id, label, html) => `<label><p class="lab">${label}</p>${html}</label>`;
const inp = (id, type, val, cls, ph) => `<input id="${id}" data-in="${id}" type="${type}" ${type === 'number' ? 'inputmode="numeric"' : ''} class="${cls || ''}" value="${esc(val)}" placeholder="${esc(ph || '')}">`;
const dateNote = (f, key) => `<div class="grid">${field(key + '.date', '日期', inp(key + '.date', 'date', f.date))}${field(key + '.note', '備註（選填）', inp(key + '.note', 'text', f.note))}</div>`;
const itemRows = (a, q, cats, stockLoc) => cats.map((c) => {
  const ps = byCat(c); if (!ps.length) return '';
  const n = ps.reduce((t, p) => t + (q[p.id] || 0), 0);
  return `<div class="grp"><span>${esc(c)}</span><span>${n ? '共 ' + n : ''}</span></div>` + ps.map((p) => `<div class="row"><span class="nm"><span>${esc(p.name)}</span><small>${stockLoc ? stockLoc + ' ' + stockOf(stockLoc, p.id) : (p.price === null ? '未定價' : money(p.price))}</small></span>${stepper(a, p.id, q[p.id])}</div>`).join('');
}).join('');
const ALLCATS = ['正裝', '針管組', '單支針管', '分裝瓶'];

/* ───────── 記一筆 ───────── */
const ACTIONS = [
  { id: 'sale', label: '商品銷售', sub: '店內・官網', quick: true },
  { id: 'course', label: '課程收款', sub: '先收全額', quick: true },
  { id: 'expense', label: '支出', sub: '運費・樣品・個人', quick: true },
  { id: 'consign', label: '代售', sub: '寄賣品牌賣出', quick: true },
  { id: 'send', label: '寄售送貨', sec: 'goods' }, { id: 'recon', label: '寄售對帳', sec: 'goods' }, { id: 'split', label: '分裝', sec: 'goods' },
  { id: 'gift', label: '公關出庫', sec: 'goods' }, { id: 'adjust', label: '庫存調整', sec: 'goods' },
  { id: 'monthly', label: '月初撥存', sub: '每月 1–5 號，依序把錢分好', sec: 'money' },
  { id: 'bills', label: '繳費', sub: '帳單付出去時，從固定支出預留付', sec: 'money' },
  { id: 'settle', label: '入帳與結清', sub: '官網款項入帳、現金存銀行、轉回店裡、繳稅', sec: 'money' },
  { id: 'transfer', label: '其他轉帳', sub: '期初資金、業主投入等', sec: 'money' }
];
// 月初分錢拆成三張卡片：每張只處理自己那一組
const MGROUP = { monthly: '月初', bills: '繳費', settle: '結清' };

function renderAdd(){
  const q = ACTIONS.filter((a) => a.quick).map((a) => `<button type="button" class="tile ${S.action === a.id ? 'on' : ''}" data-a="act" data-v="${a.id}"><b>${a.label}</b><span>${a.sub}</span></button>`).join('');
  const goods = ACTIONS.filter((a) => a.sec === 'goods').map((a) => chip(S.action === a.id, 'act', a.id, a.label, 'sq')).join('');
  const money_ = ACTIONS.filter((a) => a.sec === 'money').map((a) => `<button type="button" class="tile ${S.action === a.id ? 'on' : ''}" data-a="act" data-v="${a.id}"><b>${a.label}</b><span>${a.sub}</span></button>`).join('');
  let form = '';
  if (!S.action) form = `<div class="card" style="text-align:center;color:var(--sub)">選一個情況開始記帳<br>錢或貨經過你的手，當下就記一筆</div>`;
  else form = `<div class="card">${S.editing ? `<div class="hint" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>正在修改：${esc(S.editing.title)}（${esc(S.editing.date)}）<br>儲存後會取代原紀錄</span><button type="button" class="ghost" style="min-height:36px;padding:0 10px;flex:none" data-a="cancelEdit">取消修改</button></div>` : ''}${FORMS[S.action]()}<button type="button" class="save" data-a="save" ${S.busy ? 'disabled' : ''}>${saveLabel()}</button></div>`;
  return `<div class="sec"><div><p class="lab">常用</p><div class="grid g2">${q}</div></div><div><p class="lab">貨品</p><div class="grid g3">${goods}</div></div><div><p class="lab">店內資金</p><div class="grid g2">${money_}</div></div>${form}</div>`;
}
function saveLabel(){
  if (S.busy) return '記錄中…';
  if (S.editing) return '儲存修改';
  if (MGROUP[S.action]) { const f = S.F.monthly; const n = S.B.monthItems.filter((x) => x.group === MGROUP[S.action] && f.ticks[x.key] && num(f.amounts[x.key]) > 0).length; return n ? '記下勾選的 ' + n + ' 筆' : '請先勾選要記的項目'; }
  if (S.action === 'send') { const n = Object.values(S.F.send.q).reduce((a, b) => a + b, 0); return '送出這批（' + n + ' 件）'; }
  return '記下這筆';
}

const FORMS = {
  sale(){
    const f = S.F.sale;
    const items = byCat(f.cat).map((p) => `<button type="button" class="chip" data-a="saleAdd" data-v="${p.id}">+ ${esc(p.name.replace('・單支',''))}<small>(${stockOf('店內', p.id)})</small></button>`).join('');
    const cart = f.cart.length ? f.cart.map((l) => { const p = prod(l.id); return `<div class="row"><span class="nm"><span>${esc(p.name)}</span><small>${p.price === null ? '未定價，請先到試算表填' : money(p.price) + ' × ' + l.qty + ' = ' + money(p.price * l.qty)}</small></span>${stepper('saleQty', l.id, l.qty)}</div>`; }).join('') : `<p class="lab" style="text-align:center;margin:12px 0">這筆還沒有品項</p>`;
    const ps = promoState(f);
    let promo = '';
    if (ps && ps.slots) {
      const pr = ps.pr;
      let body = '';
      if (pr.mode === '擇一') {
        body = Array.from({ length: ps.slots }).map((_, i) => `<div><p class="lab">第 ${i + 1} 份贈品（擇一，可不選）</p><div class="chips">${pr.options.map((id) => { const st = stockOf('店內', id); const on = f.picks[i] === id; return `<button type="button" class="chip ${on ? 'on' : st <= 0 ? 'off' : ''}" data-a="pick" data-v="${i}|${id}">${esc(prod(id).name.replace('・單支', '（單支）'))}<small>(${st})</small></button>`; }).join('')}</div></div>`).join('');
      } else {
        body = `<p class="lab">自動贈送：${ps.gifts.map((g) => esc(prod(g.id).name) + ' ×' + g.qty).join('、') || '無'}</p>`;
      }
      promo = `<div class="promo"><div><div class="t">進行中的活動</div><b>${esc(pr.name)}</b><div class="lab" style="margin:0">${esc(pr.start)} – ${esc(pr.end)}・${esc(pr.mode)}</div></div>${body}</div>`;
    }
    const total = f.cart.reduce((t, l) => t + (prod(l.id).price || 0) * l.qty, 0);
    const HOLD = ['線上付款待入帳', '超商代收待入帳'];
    const payAccs = f.channel === '官網'
      ? `<div><p class="lab">付款方式（錢還沒進帳，先記在這裡）</p><div class="chips">${HOLD.filter((n) => accounts().some((a) => a.name === n)).map((n) => chip(f.account === n, 'set', 'sale.account|' + n, n === '線上付款待入帳' ? '刷卡、LINE Pay、轉帳' : '超商貨到付款', 'sq')).join('')}</div></div>`
      : `<div><p class="lab">收款方式</p><div class="chips">${accounts().filter((a) => ['收款','營運','個人'].indexOf(a.kind) > -1 && HOLD.indexOf(a.name) < 0).map((a) => chip(f.account === a.name, 'set', 'sale.account|' + a.name, esc(a.name), 'sq')).join('')}</div></div>`;
    const warn = f.channel === '店內' && accScope(f.account) === '個人' ? `<div class="hint">店的收入進了個人帳戶，會記成「代收」。之後轉回公司戶時，用「其他轉帳 › 代收款轉回」。</div>` : '';
    return `<h3>商品銷售</h3>
      <div class="grid g2">${chip(f.channel === '店內', 'set', 'sale.channel|店內', '店內', 'sq')}${chip(f.channel === '官網', 'set', 'sale.channel|官網', '官網訂單', 'sq')}</div>
      <div class="grid g4">${ALLCATS.map((c) => chip(f.cat === c, 'set', 'sale.cat|' + c, c, 'sq')).join('')}</div>
      <div><p class="lab">點品項加入這筆（括號內為店內庫存）</p><div class="chips">${items}</div></div>
      <div style="border:1px solid var(--line);border-radius:12px;padding:2px 12px">${cart}</div>
      ${promo}${payAccs}${warn}
      <div class="sum"><div class="kv b"><span>應收</span><span>${money(total)}</span></div><div class="kv s"><span>其中營業稅</span><span>${money(total - total / 1.05)}</span></div>${ps && ps.gifts.length ? `<div class="kv s"><span>贈品（不算收入，扣庫存）</span><span>${ps.gifts.map((g) => esc(prod(g.id).name) + '×' + g.qty).join('、')}</span></div>` : ''}</div>
      ${dateNote(f, 'sale')}`;
  },
  course(){
    const f = S.F.course;
    const note = courseNote(f);
    const c = S.B.courses.find((x) => x.name === f.course);
    const auto = coursePrice(c, f.people);
    return `<h3>課程收款</h3>
      <div class="chips" style="flex-direction:column;align-items:stretch">${S.B.courses.map((x, i) => `<button type="button" class="chip sq ${f.course === x.name ? 'on' : ''}" style="text-align:left" data-a="pickIdx" data-v="course.course|courses|${i}"><small style="margin-right:8px">0${i + 1}</small>${esc(x.name)}</button>`).join('')}</div>
      <div><p class="lab">人數</p><div class="grid g4">${[1,2,3,4].map((n) => chip(f.people === n, 'set', 'course.people|' + n, n + ' 人', 'sq')).join('')}</div></div>
      <div class="grid">${field('course.classDate', '上課日期', inp('course.classDate', 'date', f.classDate))}${field('course.amount', auto === null ? '金額（課程未設定價，請手填）' : '金額（預設 ' + money(auto) + '，可改）', inp('course.amount', 'number', f.amount === '' && auto !== null ? auto : f.amount, '', '0'))}</div>
      ${field('course.party', '學員（選填）', inp('course.party', 'text', f.party))}
      <div><p class="lab">收進哪個帳戶</p><div class="chips">${accounts().filter((a) => (['收款','營運'].indexOf(a.kind) > -1 && ['超商代收待入帳','線上付款待入帳'].indexOf(a.name) < 0) || a.name === '個人帳戶').map((a) => chip(f.account === a.name, 'set', 'course.account|' + a.name, esc(a.name), 'sq')).join('')}</div></div>
      ${accScope(f.account) === '個人' ? `<div class="hint">課程費匯進個人帳戶，會記成「代收」。之後轉回公司戶時，用「其他轉帳 › 代收款轉回」。</div>` : ''}
      <div class="sum"><span class="lab" style="margin:0" id="course-note">${esc(note)}</span></div>
      ${dateNote(f, 'course')}`;
  },
  expense(){
    const f = S.F.expense;
    const groups = f.scope === '店務' ? ['營業費用', '營業成本'] : ['個人支出'];
    const cats = S.B.categories.filter((c) => groups.indexOf(c.group) > -1);
    const accs = accounts().filter((a) => f.scope === '個人' ? true : a.kind !== '稅金');
    const warn = f.scope === '店務' && accScope(f.account) === '個人' ? '用個人的錢付店的支出，會自動記成「代墊」，月報會累計未還金額。'
      : f.scope === '個人' && accScope(f.account) === '店務' ? '個人開銷從店的帳戶付出，等於直接從店裡拿錢。比較乾淨的做法：先發薪水到個人帳戶，再從個人帳戶付。' : '';
    return `<h3>支出</h3>
      <div class="grid g2">${chip(f.scope === '店務', 'set', 'expense.scope|店務', '店務', 'sq')}${chip(f.scope === '個人', 'set', 'expense.scope|個人', '個人', 'sq')}</div>
      ${groups.map((g) => `<div><p class="lab">${g}</p><div class="chips">${cats.filter((c) => c.group === g).map((c) => chip(f.category === c.name, 'set', 'expense.category|' + c.name, esc(c.name))).join('')}</div></div>`).join('')}
      ${field('expense.amount', '金額（照收據填）', inp('expense.amount', 'number', f.amount, 'big', '0'))}
      <div><p class="lab">用哪個帳戶付</p><div class="chips">${accs.map((a) => chip(f.account === a.name, 'set', 'expense.account|' + a.name, esc(a.name), 'sq')).join('')}</div></div>
      ${warn ? `<div class="hint">${warn}</div>` : ''}
      ${field('expense.party', '對象（選填，例：黑貓、某廠商）', inp('expense.party', 'text', f.party))}
      ${dateNote(f, 'expense')}`;
  },
  consign(){
    const f = S.F.consign;
    const b = S.B.brands.find((x) => x.name === f.brand) || { rate: 0.4 };
    const price = num(f.price), tax = price * 0.05, shop = (price - tax) * b.rate, brand = price - tax - shop;
    return `<h3>代售：店內寄賣品牌賣出</h3>
      <div class="chips">${S.B.brands.map((x, i) => chip(f.brand === x.name, 'pickIdx', 'consign.brand|brands|' + i, esc(x.name))).join('')}</div>
      ${field('consign.price', '售價', inp('consign.price', 'number', f.price, 'big', '0'))}
      <div><p class="lab">收進哪個帳戶</p><div class="chips">${accounts().filter((a) => ['收款','營運'].indexOf(a.kind) > -1).map((a) => chip(f.account === a.name, 'set', 'consign.account|' + a.name, esc(a.name), 'sq')).join('')}</div></div>
      <div class="sum"><span class="lab" style="margin:0">先扣 5% 稅，再依 店 ${Math.round(b.rate * 10)}：品牌 ${Math.round((1 - b.rate) * 10)} 拆帳</span>
        <div class="kv"><span>稅金</span><span>${money(tax)}</span></div><div class="kv b in-c"><span>店的收入</span><span>${money(shop)}</span></div><div class="kv" style="color:var(--warn)"><span>應付品牌（不是店的錢）</span><span>${money(brand)}</span></div></div>
      ${dateNote(f, 'consign')}`;
  },
  send(){
    const f = S.F.send;
    return `<h3>寄售送貨</h3>
      <div class="grid g2">${S.B.stores.map((x, i) => chip(f.store === x.name, 'pickIdx', 'send.store|stores|' + i, esc(x.name), 'sq')).join('')}</div>
      <p class="lab" style="margin:0">這次叫貨的品項全部填完，再一次送出（右側為店內庫存）</p>
      <div>${itemRows('sendQ', f.q, ALLCATS, '店內')}</div>
      <div class="sum"><span class="lab" style="margin:0">錢沒有動，只是貨換地方放：店內逐項減少、${esc(f.store)} 逐項增加。運費另外用「支出 › 運費」記。</span></div>
      ${dateNote(f, 'send')}`;
  },
  recon(){
    const f = S.F.recon;
    const T = reconTargets();
    const tg = T.find((x) => x.key === f.store) || T[0] || { members: [], cfg: {} };
    const st = tg.cfg || {};
    const months = [-2, -1, 0].map((d) => addMonth(curMonth(), d));
    const head = `<h3>寄售對帳／收款</h3>
      <div class="grid g2">${chip(f.mode === '對帳', 'set', 'recon.mode|對帳', '對帳（報表到了）', 'sq')}${chip(f.mode === '收款', 'set', 'recon.mode|收款', '收款（錢到了）', 'sq')}</div>
      <div class="grid g2">${T.map((x, i) => chip(f.store === x.key, 'reconT', i, esc(x.label), 'sq')).join('')}</div>
      <div><p class="lab">銷售月份（收入算在這個月，不是收款日）</p><div class="grid g3">${months.map((m) => chip(f.salesMonth === m, 'set', 'recon.salesMonth|' + m, m.replace('-', ' / '), 'sq')).join('')}</div></div>`;
    if (f.mode === '收款') {
      return head + `${field('recon.amount', tg.members.length > 1 ? '實收金額（合併匯款的總額）' : '實收金額', inp('recon.amount', 'number', f.amount, 'big', '0'))}
        <div><p class="lab">收進哪個帳戶</p><div class="chips">${accounts().filter((a) => ['收款','營運'].indexOf(a.kind) > -1).map((a) => chip(f.account === a.name, 'set', 'recon.account|' + a.name, esc(a.name), 'sq')).join('')}</div></div>
        <div class="sum"><span class="lab" style="margin:0">收款會沖銷「寄售應收未收」，不會重複算成收入。</span></div>${dateNote(f, 'recon')}`;
    }
    const multi = tg.members.length > 1;
    const short = (x) => multi ? x.name.replace(tg.group, '').trim() : '';
    let rows = '';
    ALLCATS.forEach((c) => { const ps = byCat(c); if (!ps.length) return;
      const n = ps.reduce((t, p) => t + tg.members.reduce((a, _, i) => a + (f.q[i + ':' + p.id] || 0), 0), 0);
      rows += `<div class="grp"><span>${esc(c)}</span><span>${n ? '共 ' + n : ''}</span></div>`;
      rows += ps.map((p) => multi
        ? `<div class="row" style="flex-wrap:wrap"><span class="nm" style="flex-basis:100%"><span>${esc(p.name)}</span><small>${p.price === null ? '未定價' : money(p.price)}</small></span><div style="display:flex;flex-wrap:wrap;gap:8px;width:100%">${tg.members.map((m, i) => `<div style="flex:1 1 128px;display:flex;align-items:center;justify-content:space-between;background:var(--paper);border-radius:10px;padding:2px 4px 2px 10px"><small style="color:var(--blue);white-space:nowrap;margin-right:4px">${esc(short(m))}</small>${stepper('reconQ', i + ':' + p.id, f.q[i + ':' + p.id], 1)}</div>`).join('')}</div></div>`
        : `<div class="row"><span class="nm"><span>${esc(p.name)}</span><small>${p.price === null ? '未定價' : money(p.price)}</small></span>${stepper('reconQ', '0:' + p.id, f.q['0:' + p.id])}</div>`).join('');
    });
    const gross = Object.keys(f.q).reduce((t, k) => t + (f.q[k] || 0) * (prod(k.split(':')[1]).price || 0), 0);
    const ours = st.group && st.threshold && gross >= st.threshold && st.rateAfter !== null ? st.rateAfter : st.rate || 0.6;
    const comm = gross * (1 - ours);
    const gnote = multi ? `${esc(tg.label)} 合併成一筆對帳。當月合計滿 ${money(st.threshold)}，整筆改為我方 ${Math.round((st.rateAfter || 0) * 10)} 成。件數依報表填在各店，庫存會從各店分別扣；報表沒分店的話，全部填在其中一家也可以。`
      : st.group ? `${esc(st.group)} 各店合併計算門檻，這裡只用本筆試算，月報會用合併金額重算。` : '每個品項分開記，系統會從這家的寄售庫存逐項扣掉。';
    return head + `<div>${rows}</div>
      <div class="sum"><div class="kv"><span>銷售總額</span><span>${money(gross)}</span></div><div class="kv"><span>對方抽成（我方 ${Math.round(ours * 10)} 成）</span><span>−${money(comm)}</span></div><div class="kv b in-c"><span>應收金額</span><span>${money(gross - comm)}</span></div><span class="lab" style="margin:0">${gnote}</span></div>
      ${dateNote(f, 'recon')}`;
  },
  split(){
    const f = S.F.split;
    const series = [...new Set(byCat('正裝').map((p) => p.series).filter(Boolean))];
    const fulls = byCat('正裝').filter((p) => p.series === f.series);
    const kits = byCat('針管組').filter((p) => p.series === f.series);
    const singles = byCat('單支針管').filter((p) => p.series === f.series);
    const o = (id) => f.open[id] || { bad: 0, good: 0 };
    const opened = fulls.reduce((t, p) => t + o(p.id).bad + o(p.id).good, 0);
    const openedBad = fulls.reduce((t, p) => t + o(p.id).bad, 0);
    const used = kits.reduce((t, p) => t + (f.made[p.id] || 0) * 3, 0) + singles.reduce((t, p) => t + (f.made[p.id] || 0), 0);
    const shown = fulls.reduce((t, p) => t + Math.min(f.show[p.id] || 0, o(p.id).bad + o(p.id).good), 0);
    return `<h3>分裝：拆正裝做針管</h3>
      <div class="grid g2">${series.map((s) => chip(f.series === s, 'set', 'split.series|' + s, esc(s), 'sq')).join('')}</div>
      <div class="grp"><span>① 拆了哪些瓶（瑕疵與良品分開填）</span></div>
      ${fulls.map((p) => `<div class="row" style="flex-wrap:wrap"><span class="nm" style="flex-basis:100%"><b style="font-weight:500">${esc(p.name)}</b></span>
        <div style="display:flex;flex-wrap:wrap;gap:8px;width:100%"><div style="flex:1 1 128px;display:flex;align-items:center;justify-content:space-between;background:var(--warnbg);border-radius:10px;padding:2px 4px 2px 10px"><small style="color:var(--warn);white-space:nowrap;margin-right:4px">瑕疵 剩${stockOf('店內', p.id, '瑕疵')}</small>${stepper('openBad', p.id, o(p.id).bad, 1)}</div>
        <div style="flex:1 1 128px;display:flex;align-items:center;justify-content:space-between;background:var(--paper);border-radius:10px;padding:2px 4px 2px 10px"><small style="color:var(--blue);white-space:nowrap;margin-right:4px">良品 剩${stockOf('店內', p.id)}</small>${stepper('openGood', p.id, o(p.id).good, 1)}</div></div></div>`).join('')}
      <div class="grp"><span>② 實際做出多少（自己填）</span></div>
      ${kits.map((p) => `<div class="row"><span class="nm"><span>${esc(p.name)}</span><small>一組 3 支，三款各一</small></span>${stepper('made', p.id, f.made[p.id])}</div>`).join('')}
      ${singles.map((p) => `<div class="row"><span class="nm"><span>${esc(p.name)}</span><small>單支銷售線</small></span>${stepper('made', p.id, f.made[p.id])}</div>`).join('')}

function moneyForm(group, title, desc, numbered){
  if (!S.F.monthly) initMonthly();
  const f = S.F.monthly;
  const m = Number(f.date.slice(5, 7));
  const items = S.B.monthItems.filter((x) => x.group === group);
  const row = (x, i) => { const on = !!f.ticks[x.key];
    const due = group === '月初' ? '' : !x.months.length ? (group === '繳費' ? '<span class="tag">每月</span>' : '') : x.months.indexOf(m) > -1 ? '<span class="tag w">本月要繳</span>' : `<span class="tag">${x.months.join('、')} 月繳</span>`;
    const route = x.kind === '轉帳' ? `${x.from} → ${x.to}` : `${x.from} 付出`;
    const changed = num(f.amounts[x.key]) !== num(x.def) ? `・預設 ${money(x.def)}` : '';
    return `<div class="mi ${on ? 'on' : ''}"><button type="button" class="tick ${on ? 'on' : ''}" data-a="mtick" data-v="${x.key}" aria-label="${on ? '取消' : ''}勾選 ${esc(x.label)}">${on ? '✓' : (numbered ? i + 1 : '')}</button>
      <span class="nm"><b>${esc(x.label)}${due}</b><small>${esc(route)}${changed}</small></span>
      <label><span class="sr">${esc(x.label)} 金額</span><input class="amt" id="m.${x.key}" data-in="m.${x.key}" type="number" inputmode="numeric" value="${esc(f.amounts[x.key])}"></label>${x.note && group !== '繳費' ? `<small class="mnote">${esc(x.note)}</small>` : ''}</div>`; };
  const total = items.filter((x) => f.ticks[x.key]).reduce((t, x) => t + num(f.amounts[x.key]), 0);
  return `<h3>${title}</h3><p class="lab" style="margin:0">${desc}</p>
    ${items.map(row).join('')}
    <div class="kv b" style="border-top:1px solid var(--line);padding-top:8px"><span>勾選合計</span><span>${money(total)}</span></div>
    ${field('monthly.date', '日期', inp('monthly.date', 'date', f.date))}`;
}

/* ───────── 送出 ───────── */
function payload(){
  const a = S.action, F = S.F;
  if (a === 'sale') { const f = F.sale; const ps = promoState(f); return { action: 'sale', date: f.date, note: f.note, channel: f.channel, account: f.account, lines: f.cart, gifts: ps ? ps.gifts : [], promo: ps && ps.gifts.length ? ps.pr.name : '' }; }
  if (a === 'course') { const f = F.course; const auto = coursePrice(S.B.courses.find((x) => x.name === f.course), f.people); return { action: 'course', date: f.date, note: f.note, course: f.course, people: f.people, classDate: f.classDate, amount: f.amount === '' ? auto : f.amount, account: f.account, party: f.party }; }
  if (a === 'expense') { const f = F.expense; return { action: 'expense', date: f.date, note: f.note, category: f.category, amount: f.amount, account: f.account, party: f.party }; }
  if (a === 'consign') { const f = F.consign; return { action: 'consign', date: f.date, note: f.note, brand: f.brand, price: f.price, account: f.account }; }
  if (a === 'send') { const f = F.send; return { action: 'send', date: f.date, note: f.note, store: f.store, lines: Object.keys(f.q).map((id) => ({ id, qty: f.q[id] })) }; }
  if (a === 'recon') { const f = F.recon; const tg = reconTargets().find((x) => x.key === f.store) || { members: [] };
    return f.mode === '收款' ? { action: 'reconPay', date: f.date, note: f.note, store: f.store, salesMonth: f.salesMonth, amount: f.amount, account: f.account }
      : { action: 'recon', date: f.date, note: f.note, store: f.store, salesMonth: f.salesMonth, lines: Object.keys(f.q).map((k) => { const [i, id] = k.split(':'); return { id, qty: f.q[k], store: (tg.members[+i] || {}).name }; }) }; }
  if (a === 'split') { const f = F.split; return { action: 'split', date: f.date, note: f.note, series: f.series, opens: Object.keys(f.open).map((id) => ({ id, bad: f.open[id].bad, good: f.open[id].good, show: f.show[id] || 0 })), made: Object.keys(f.made).map((id) => ({ id, qty: f.made[id] })) }; }
  if (a === 'gift') { const f = F.gift; return { action: 'gift', date: f.date, note: f.note, party: f.party, lines: Object.keys(f.q).map((id) => ({ id, qty: f.q[id] })) }; }
  if (MGROUP[a]) { const f = F.monthly; return { action: 'transfers', date: f.date, items: S.B.monthItems.filter((x) => x.group === MGROUP[a] && f.ticks[x.key] && num(f.amounts[x.key]) > 0).map((x) => ({ key: x.key, amount: f.amounts[x.key] })) }; }
  if (a === 'adjust') { const f = F.adjust; return { action: 'adjust', date: f.date, note: f.note, loc: f.loc, state: f.state, lines: Object.keys(f.q).map((id) => ({ id, qty: f.q[id] })) }; }
  if (a === 'transfer') { const f = F.transfer; return { action: 'transfer', date: f.date, note: f.note, category: f.category, from: f.from, to: f.to, amount: f.amount }; }
}
async function save(){
  if (S.busy) return;
  S.busy = true; render();
  try {
    const tx = payload();
    const wasEdit = !!S.editing;
    if (wasEdit) tx.replaceId = S.editing.id;
    const r = await api({ action: 'add', tx });
    toast(wasEdit ? '已修改' : '已記下' + (r.result.count > 1 ? ' ' + r.result.count + ' 筆' : ''));
    if (wasEdit) { S.editing = null; S.action = ''; S.tab = 'list'; S.openEntry = ''; }
    const keep = S.action;
    await boot(true);
    initForms(); if (MGROUP[keep]) S.F.monthly = null;
    S.items = null; S.summary = null;
  } catch(e){ toast(e.message); }
  S.busy = false; render();
}

/* ───────── 修改：把原紀錄帶回表單 ───────── */
const qOf = (ls) => { const q = {}; (ls || []).forEach((l) => { q[l.id] = (q[l.id] || 0) + l.qty; }); return q; };
function prefillable(t){ return ['商品銷售','課程收款','代售','支出','寄售送貨','寄售對帳','寄售收款','分裝','公關出庫','庫存調整','轉帳','月初分錢'].indexOf(t.action) > -1; }
function prefill(t){
  if (!prefillable(t)) return false;
  initForms();
  const d = t.d || {}, F = S.F;
  const base = { date: t.date, note: t.note || '' };
  switch (t.action) {
    case '商品銷售': {
      const picks = []; (d.gifts || []).forEach((g) => { for (let i = 0; i < g.qty; i++) picks.push(g.id); });
      const first = prod((d.lines || [{}])[0].id);
      Object.assign(F.sale, base, { channel: d.channel || '店內', account: t.to, cart: (d.lines || []).map((l) => ({ id: l.id, qty: l.qty })), picks, cat: first.cat || '正裝' });
      S.action = 'sale'; break;
    }
    case '課程收款': Object.assign(F.course, base, { course: d.course, people: d.people || 1, classDate: d.classDate || '', amount: t.amount, account: t.to, party: t.party }); S.action = 'course'; break;
    case '代售': Object.assign(F.consign, base, { brand: t.party, price: t.amount, account: t.to }); S.action = 'consign'; break;
    case '支出': Object.assign(F.expense, base, { scope: t.scope === '個人' ? '個人' : '店務', category: t.category, amount: t.amount, account: t.from, party: t.party }); S.action = 'expense'; break;
    case '寄售送貨': Object.assign(F.send, base, { store: t.party, q: qOf(d.lines) }); S.action = 'send'; break;
    case '寄售對帳': {
      const key = d.group ? 'G:' + d.group : t.party;
      const tg = reconTargets().find((x) => x.key === key) || { members: [] };
      const q = {}; (d.lines || []).forEach((l) => { const i = Math.max(0, tg.members.findIndex((m) => m.name === l.store)); q[i + ':' + l.id] = (q[i + ':' + l.id] || 0) + l.qty; });
      Object.assign(F.recon, base, { mode: '對帳', store: key, salesMonth: t.rec, q }); S.action = 'recon'; break;
    }
    case '寄售收款': { const isG = reconTargets().some((x) => x.key === 'G:' + t.party); Object.assign(F.recon, base, { mode: '收款', store: isG ? 'G:' + t.party : t.party, salesMonth: t.rec, amount: t.amount, account: t.to }); S.action = 'recon'; break; }
    case '分裝': {
      const open = {}, show = {}; (d.opens || []).forEach((o) => { open[o.id] = { bad: o.bad, good: o.good }; if (o.show) show[o.id] = o.show; });
      Object.assign(F.split, base, { series: t.party, open, show, made: qOf(d.made) }); S.action = 'split'; break;
    }
    case '公關出庫': Object.assign(F.gift, base, { party: t.party, q: qOf(d.lines) }); S.action = 'gift'; break;
    case '庫存調整': { const [loc, state] = String(t.party).split('・'); Object.assign(F.adjust, base, { loc, state: state || '良品', q: qOf(d.lines) }); S.action = 'adjust'; break; }
    default: // 轉帳、月初分錢的單筆
      if (t.flow === '支出') { Object.assign(F.expense, base, { scope: t.scope === '個人' ? '個人' : '店務', category: t.category, amount: t.amount, account: t.from, party: t.party }); S.action = 'expense'; }
      else if (t.flow === '付款') { Object.assign(F.transfer, base, { category: '代售貨款支付', from: t.from, to: '', amount: t.amount }); S.action = 'transfer'; }
      else { Object.assign(F.transfer, base, { category: t.category, from: t.from, to: t.to, amount: t.amount }); S.action = 'transfer'; }
  }
  return true;
}

/* ───────── 明細 ───────── */
function entryText(t){
  const d = t.d || {};
  const lines = (ls) => (ls || []).map((l) => l.name.replace('・單支', '（單支）') + '×' + l.qty).join('、');
  switch (t.action) {
    case '商品銷售': return { title: lines(d.lines), sub: (d.channel === '官網' ? '官網・' : '店內・') + t.to + (d.gifts && d.gifts.length ? '・贈 ' + lines(d.gifts) : ''), amt: '+' + money(t.amount), c: 'in-c' };
    case '課程收款': return { title: d.course, sub: d.people + ' 人・上課 ' + d.classDate + '・' + t.to, amt: '+' + money(t.amount), c: 'in-c' };
    case '代售': return { title: t.party + ' 代售', sub: '店的收入 ' + money((d.shop || 0) + (d.tax || 0)) + '・應付品牌 ' + money(d.brand), amt: '+' + money(t.amount), c: 'in-c' };
    case '支出': return { title: t.category, sub: (t.scope === '個人' ? '個人・' : '') + t.from + (t.party ? '・' + t.party : ''), amt: '−' + money(t.amount), c: 'out-c' };
    case '寄售送貨': return { title: '送貨到 ' + t.party, sub: lines(d.lines), amt: '庫存', c: '' };
    case '寄售對帳': return { title: t.party + ' 對帳（' + t.rec + '）', sub: d.group ? (d.lines || []).map((l) => l.store.replace(d.group, '').trim() + '・' + l.name + '×' + l.qty).join('、') : lines(d.lines), amt: money(t.amount), c: '' };
    case '寄售收款': return { title: t.party + ' 收款', sub: t.rec + ' 的款項・' + t.to, amt: '+' + money(t.amount), c: 'in-c' };
    case '分裝': return { title: t.party + ' 分裝', sub: '拆 ' + (d.opens || []).reduce((a, o) => a + o.bad + o.good, 0) + ' 瓶・做出 ' + lines(d.made), amt: '庫存', c: '' };
    case '公關出庫': return { title: '公關出庫・' + t.party, sub: lines(d.lines), amt: '庫存', c: '' };
    case '庫存調整': return { title: '庫存調整・' + t.party, sub: (d.lines || []).map((l) => l.name + (l.qty > 0 ? '+' : '') + l.qty).join('、'), amt: '庫存', c: '' };
    default: return { title: t.party || t.category, sub: t.flow === '轉帳' ? t.from + ' → ' + t.to : (t.from || t.to), amt: (t.flow === '支出' || t.flow === '付款' ? '−' : t.flow === '收入' ? '+' : '') + money(t.amount), c: t.flow === '支出' || t.flow === '付款' ? 'out-c' : t.flow === '收入' ? 'in-c' : '' };
  }
}

  let out = nav + '<p class="lab" style="margin:8px 0 0">點一筆可以修改或作廢（貨和錢會一起更正）</p>', day = '';

  });
  return out;

  const head = `<div style="display:flex;justify-content:space-between;align-items:baseline"><h2>現有庫存</h2><button class="ghost" style="min-height:36px;padding:0 12px" data-a="refresh">重新整理</button></div>
    <div class="grid g2">${chip(S.stockView === 0, 'sv', 0, '依品項', 'sq')}${chip(S.stockView === 1, 'sv', 1, '依地點', 'sq')}</div>
    <div class="grid g4">${kpi('正裝良品', sumCat('正裝'))}${kpi('瑕疵品', sumCat('正裝', '瑕疵'))}${kpi('針管組', sumCat('針管組'))}${kpi('單支', sumCat('單支針管'))}</div>`;
  let body = '';
  if (S.stockView === 0) {
    body = ALLCATS.map((c) => { const ps = byCat(c); if (!ps.length) return '';
      const rows = ps.map((p) => { const g = stockOf('店內', p.id), b = stockOf('店內', p.id, '瑕疵'), d = stockOf('店內展示', p.id, '展示');
        const cons = S.B.stores.reduce((t, s) => t + stockOf(s.name, p.id), 0);
        const detail = c === '正裝' ? `良品 ${g}・瑕疵 ${b}・展示瓶 ${d}・寄售點 ${cons}` : `店內 ${g}・寄售點 ${cons}`;
        return `<div class="row"><span class="nm"><b>${esc(p.name.replace('・單支', ''))}${g <= low ? '<span class="tag w">' + (g <= 0 ? '缺貨' : '偏低') + '</span>' : ''}</b><small>${detail}</small></span><b style="font-size:20px;font-variant-numeric:tabular-nums">${g + b}</b></div>`; }).join('');
      return `<div class="card" style="gap:0"><div class="grp" style="margin:0 0 4px"><span>${c}（店內）</span><span>共 ${ps.reduce((t, p) => t + stockOf('店內', p.id) + stockOf('店內', p.id, '瑕疵'), 0)}</span></div>${rows}</div>`; }).join('');
  } else {
    const place = (label, loc, st, note) => { const rows = P().map((p) => ({ p, v: stockOf(loc, p.id, st) })).filter((r) => r.v);
      return `<div class="card" style="gap:4px"><div style="display:flex;justify-content:space-between"><b>${esc(label)}</b><small style="color:var(--sub)">${rows.length ? rows.length + ' 項' : ''}</small></div><small style="color:var(--sub)">${note}</small>${rows.length ? rows.map((r) => `<div class="kv"><span>${esc(r.p.name)}</span><b>${r.v}</b></div>`).join('') : '<small style="color:var(--sub)">目前沒有紀錄</small>'}</div>`; };
    body = place('店內・可賣', '店內', '良品', '良品正裝、針管組、單支、分裝瓶') + place('店內・瑕疵品', '店內', '瑕疵', '包裝瑕疵，優先拿來分裝') + place('店內・展示瓶', '店內展示', '展示', '拆封後沒用完的正裝，不能賣') +
      S.B.stores.map((s) => place(s.name, s.name, '良品', '開帳後送貨減去對帳；期初數量回報後用「調整」補上')).join('') + locs.filter((l) => !S.B.stores.some((s) => s.name === l)).map((l) => place(l, l, '良品', '')).join('');
  }
  return `<div class="sec">${head}${body}</div>`;
}

/* ───────── 月報 ───────── */
function renderReport(){
  const m = S.month;
  const nav = `<div style="display:flex;justify-content:space-between;align-items:center"><h2>月報</h2><div class="mon"><button data-a="rm" data-v="-1" aria-label="上個月">‹</button><span>${m.replace('-', ' / ')}</span><button data-a="rm" data-v="1" aria-label="下個月">›</button></div></div>`;
  if (!S.summary || S.summary.month !== m) { loadSummary(); return nav + '<div class="empty">計算中…</div>'; }
  const s = S.summary;
  if (s.error) return nav + '<div class="empty">讀取失敗，請按上下月份重試</div>';
  const kv = (k, v, cls) => `<div class="kv ${cls || ''}"><span>${k}</span><span>${money(v)}</span></div>`;
  const sub = (o) => Object.keys(o).map((k) => kv(esc(k), o[k], 'ind')).join('');
  const det = (o) => Object.keys(o).filter((k) => Math.round(o[k])).map((k) => kv(esc(k), o[k], 'det')).join('');
  const n = (v) => Math.round(v).toLocaleString('en-US');
  const tot = (k, v, fx) => `<div class="res${v < 0 ? ' neg' : ''}">${kv(k, v, v < 0 ? 'out-c' : '')}<div class="fx">${fx}</div></div>`;
  const grp = (h) => h ? `<div class="grp">${h}</div>` : '';
  const minus = (k, v) => Math.round(v) ? kv('－ ' + k, -v, 'minus') : '';
  const sign = (v) => v >= 0 ? 'in-c' : 'out-c';
  const pct = Math.max(0, Math.min(100, s.breakevenTarget ? s.breakevenActual / s.breakevenTarget * 100 : 0));
  const bp = Math.max(0, Math.min(100, s.batch.saved / s.batch.target * 100));
  const promos = s.promos.length ? s.promos.map((p) => `<div class="card" style="gap:4px"><div style="display:flex;justify-content:space-between"><b>活動：${esc(p.name)}</b></div>${p.sold ? `<div class="kv"><span>活動期間賣出正裝</span><span>${p.sold} 瓶</span></div>` : ''}${Object.keys(p.gifts).map((k) => `<div class="kv ind"><span>贈出 ${esc(k)}</span><span>${p.gifts[k]}</span></div>`).join('')}<div class="kv tot"><span>贈品價值（以售價計，參考）</span><span>${money(p.value)}${p.unpriced ? ' ＋未定價品項' : ''}</span></div></div>`).join('') : '';
  const pend = [];
  if (s.pending.receivable > 0) pend.push(kv('寄售應收未收', s.pending.receivable));
  if (s.pending.personalFromShop > 0) pend.push(kv('本月用店帳戶付的個人開銷', s.pending.personalFromShop));
  if (s.pending.missingRecon.length) pend.push(`<div class="kv"><span>本月還沒對帳</span><span>${esc(s.pending.missingRecon.join('、'))}</span></div>`);
  return `<div class="sec">${nav}
    <div class="card pl"><p class="lab" style="margin:0">一層一層往下扣：灰框是要扣掉的錢，色條是扣完剩下的（負數會變橘色）。</p>
      <div class="blk">${kv('收入（含稅）', s.revenue, 'b')}${det(s.revenueBy)}</div>
      ${grp(minus('營業稅（5%）', s.tax) + minus('寄售點抽成', s.commission) + minus('商品成本', s.cogs) + det(s.cogsBy))}
      ${tot('＝ 毛利', s.gross, '收入 ' + n(s.revenue) + ' − 營業稅 ' + n(s.tax) + (s.commission ? ' − 抽成 ' + n(s.commission) : '') + ' − 商品成本 ' + n(s.cogs))}
      ${grp(minus('營業費用', s.opex) + det(s.opexBy))}
      ${tot('＝ 營業淨利', s.operating, '毛利 ' + n(s.gross) + ' − 營業費用 ' + n(s.opex))}
      ${grp(minus('主理人薪水', s.salary))}
      ${s.salary ? tot('＝ 店真正留下的', s.afterSalary, '營業淨利 ' + n(s.operating) + ' − 薪水 ' + n(s.salary)) : ''}
      ${grp(minus('撥存', s.reserves))}
      ${tot('＝ 可自由運用', s.free, s.salary || s.reserves ? (s.salary ? '店真正留下的 ' + n(s.afterSalary) : '營業淨利 ' + n(s.operating)) + (s.reserves ? ' − 撥存 ' + n(s.reserves) : '') : '本月還沒記薪水和撥存，所以跟營業淨利一樣')}
      <p class="lab" style="margin:4px 0 0">・房租、網路、電費在「繳費」記了才會出現；勞健保、發票機不是每月繳，先每月攤一份，所以月初就會看到。<br>・月中看這張會偏負，因為費用先算、收入還沒進來，看月底的數字才準。<br>・第一批貨的成本沒有記，所以商品成本偏低、毛利偏高，最接近真實的是「可自由運用」。</p></div>
    <div class="card" style="gap:8px"><p class="lab" style="margin:0">打平線：固定支出＋薪水＋撥存 ${money(s.breakevenTarget)}</p><div class="bar"><i style="width:${pct}%"></i></div><div class="kv"><span>扣掉抽成、成本、零碎費用後 ${money(s.breakevenActual)}</span><span class="${s.breakevenActual >= s.breakevenTarget ? 'in-c' : 'out-c'}">${s.breakevenActual >= s.breakevenTarget ? '已達成' : '還差 ' + money(s.breakevenTarget - s.breakevenActual)}</span></div></div>
    <div class="card" style="gap:8px"><p class="lab" style="margin:0">第二批原料預留：目標 ${money(s.batch.target)}</p><div class="bar"><i style="width:${bp}%;background:var(--blue)"></i></div><div class="kv"><span>已存 ${money(s.batch.saved)}</span><span>還差 ${money(Math.max(0, s.batch.target - s.batch.saved))}</span></div></div>
    ${promos}
    ${oweCard(s)}
    ${vatCard(s)}
    <div class="card" style="gap:6px"><p class="lab" style="margin:0">帳戶裡，但不能動的錢</p>${kv('預收課程款（還沒上課）', s.held.prepaid)}${kv('代售應付（品牌的錢）', s.held.payable)}${kv('稅金預留', s.held.taxReserve)}</div>
    ${pend.length ? `<div class="card" style="gap:6px;background:var(--warnbg);border-color:#EAD9B5"><p class="lab" style="margin:0;color:var(--warn)">待處理</p>${pend.join('')}</div>` : ''}
    <div class="card" style="gap:4px"><p class="lab" style="margin:0">月底帳戶餘額（和銀行、LINE Pay 對一次）</p>${s.balances.map((b) => `<div class="kv"><span>${esc(b.name)}${b.scope === '個人' ? '<span class="tag">個人</span>' : ''}</span><span class="${b.balance < 0 ? 'out-c' : ''}">${money(b.balance)}</span></div>${/待入帳$/.test(b.name) ? `<small class="lab" style="margin:-2px 0 4px">${b.balance > 0 ? '平台還欠你的錢' : b.balance < 0 ? '錢已經收了，但還有貨沒出' : '錢和貨都對上了'}</small>` : ''}`).join('')}<p class="lab" style="margin:4px 0 0">兩個「待入帳」帳戶：正數：平台還欠你的錢。負數：錢已經收了，但還有貨沒出。</p></div>
    ${itemCard(s)}
    ${s.personal ? `<div class="card" style="gap:4px"><p class="lab" style="margin:0">主理人個人支出</p>${kv('合計', s.personal, 'b')}${sub(s.personalBy)}</div>` : ''}
  </div>`;
}
function oweCard(s){

  const head = o.net > 0 ? ['個人帳戶要轉給店', 'out-c'] : o.net < 0 ? ['店要還給個人帳戶', 'out-c'] : ['已經結清', 'in-c'];

    <div class="kv ind"><span>店的錢進了個人帳戶</span><span>${money(o.inPersonal)}</span></div>
    <div class="kv ind"><span>個人幫店付的（代墊）</span><span>−${money(o.advanced)}</span></div>
    ${o.returned ? `<div class="kv ind"><span>已經轉回店裡</span><span>−${money(o.returned)}</span></div>` : ''}

    <p class="lab" style="margin:2px 0 0">${o.net > 0 ? '公司戶開好後，用「入帳與結清 › 個人帳戶轉回店裡」記一筆，金額已自動帶好。' : o.net < 0 ? '用「入帳與結清 › 代墊歸還」記一筆，金額已自動帶好。' : '個人帳戶裡沒有店的錢，也沒有欠個人的錢。'}</p>
  </div>`;

function vatCard(s){
  const v = s.vat; if (!v) return '';
  const md = (m) => m.slice(5).replace(/^0/, '');
  const per = (p) => { const [a, b] = p.split('～'); return a.slice(0, 4) + ' 年 ' + md(a) + '–' + md(b) + ' 月'; };
  const dl = (d) => d.slice(0, 4) + '/' + d.slice(5, 7) + '/' + d.slice(8);
  const ok = v.gap >= 0;
  return `<div class="card" style="gap:6px;font-variant-numeric:tabular-nums">
    <p class="lab" style="margin:0">本期營業稅（兩個月一期）</p>
    <div class="kv b"><span>${per(v.period)} 累計應提</span><span>${money(v.accrued)}</span></div>
    <div class="kv s"><span>這一期在 ${dl(v.deadline)} 前申報</span><span></span></div>
    ${v.isFiling && (v.prevDue || v.paidThisMonth) ? `<div class="kv" style="margin-top:4px"><span>上一期 ${per(v.prevPeriod)} 應繳</span><span>${money(v.prevDue)}</span></div>
      <div class="kv s"><span>本月 15 日前申報${v.paidThisMonth ? '，已繳 ' + money(v.paidThisMonth) : '，尚未記繳納'}</span><span></span></div>` : ''}
    <div class="kv tot"><span>稅金預留目前</span><span>${money(v.reserve)}</span></div>
    <div class="kv b ${ok ? 'in-c' : 'out-c'}"><span>${ok ? '足夠，多出' : '還差'}</span><span>${money(Math.abs(v.gap))}</span></div>
    <p class="lab" style="margin:2px 0 0">應提稅金＝收入裡含的 5% 營業稅，還沒扣掉進貨、房租等有統編發票的進項稅額，所以實際要繳的通常會少一些。繳稅時用「入帳與結清 › 繳營業稅」或「其他轉帳 › 營業稅繳納」記。</p>
  </div>`;
}
function itemCard(s){

    <div class="is t"><span>小計${c.gift ? `<small style="color:var(--sub);font-weight:400">（贈出 ${c.gift}）</small>` : ''}</span><span>${n(c.store)}</span><span>${n(c.web)}</span><span>${n(c.consign)}</span><span>${n(c.total)}</span></div>`).join('');

/* ───────── 事件 ───────── */
function setPath(path, val){
  const [form, key] = path.split('.');
  if (form === 'm') { S.F.monthly.amounts[key] = val === '' ? '' : Number(val); return; }
  if (form === 'monthly') { S.F.monthly[key] = val; return; }
  const f = S.F[form]; if (!f) return;
  if (['people'].indexOf(key) > -1) val = Number(val);
  if (form === 'sale' && key === 'cat') { f.cat = val; return; }
  if (form === 'sale' && key === 'channel') { f.channel = val; f.account = val === '官網' ? '線上付款待入帳' : '店內現金'; return; }
  if (form === 'expense' && key === 'scope') { f.scope = val; f.category = val === '店務' ? '運費' : '餐飲'; f.account = val === '店務' ? '公司營運戶' : '個人帳戶'; return; }
  if (form === 'course' && (key === 'course' || key === 'people')) f.amount = '';
  if (form === 'split' && key === 'series') { f.open = {}; f.made = {}; f.show = {}; }
  f[key] = val;
}
const bump = (obj, id, d) => { obj[id] = Math.max(0, (obj[id] || 0) + d); if (!obj[id]) delete obj[id]; };
const H = {
  tab(v){ S.tab = v; if (v === 'list') S.items = null; if (v === 'report') S.summary = null; render(); },
  act(v){ if (S.editing && v !== S.action) { S.editing = null; initForms(); toast('已取消修改'); } S.action = S.action === v ? '' : v; if (MGROUP[v] && !S.F.monthly) initMonthly(); render(); },
  set(v){ const i = v.indexOf('|'); setPath(v.slice(0, i), v.slice(i + 1)); render(); },
  // 用位置選，不用名稱比對：名稱裡有隱藏換行時也不會選不到
  pickIdx(v){ const [path, list, i] = v.split('|'); const item = (S.B[list] || [])[+i]; if (item) setPath(path, item.name); render(); },
  saleAdd(id){ const c = S.F.sale.cart; const l = c.find((x) => x.id === id); if (l) l.qty++; else c.push({ id, qty: 1 }); render(); },
  saleQty(v){ const [id, d] = v.split('|'); const c = S.F.sale.cart; const l = c.find((x) => x.id === id); if (l) { l.qty += +d; if (l.qty <= 0) c.splice(c.indexOf(l), 1); } render(); },
  pick(v){ const [i, id] = v.split('|'); const p = S.F.sale.picks; if (p[i] === id) p[i] = ''; else if (!S.editing && stockOf('店內', id) <= 0) { toast(prod(id).name + ' 目前沒有庫存'); return; } else p[i] = id; render(); },
  sendQ(v){ const [id, d] = v.split('|'); bump(S.F.send.q, id, +d); render(); },
  reconQ(v){ const [id, d] = v.split('|'); bump(S.F.recon.q, id, +d); render(); },
  reconT(i){ const tg = reconTargets()[+i]; if (tg && tg.key !== S.F.recon.store) { S.F.recon.store = tg.key; S.F.recon.q = {}; } render(); },
  giftQ(v){ const [id, d] = v.split('|'); bump(S.F.gift.q, id, +d); render(); },
  openBad(v){ const [id, d] = v.split('|'); const o = S.F.split.open[id] || (S.F.split.open[id] = { bad: 0, good: 0 }); o.bad = Math.max(0, Math.min(S.editing ? 999 : stockOf('店內', id, '瑕疵'), o.bad + +d)); render(); },
  openGood(v){ const [id, d] = v.split('|'); const o = S.F.split.open[id] || (S.F.split.open[id] = { bad: 0, good: 0 }); o.good = Math.max(0, Math.min(S.editing ? 999 : stockOf('店內', id), o.good + +d)); render(); },
  made(v){ const [id, d] = v.split('|'); bump(S.F.split.made, id, +d); render(); },
  adjQ(v){ const [id, d] = v.split('|'); const q = S.F.adjust.q; q[id] = (q[id] || 0) + +d; if (!q[id]) delete q[id]; render(); },
  show(v){ const [id, d] = v.split('|'); const o = S.F.split.open[id] || { bad: 0, good: 0 }; S.F.split.show[id] = Math.max(0, Math.min(o.bad + o.good, (S.F.split.show[id] || 0) + +d)); render(); },
  mtick(k){ S.F.monthly.ticks[k] = !S.F.monthly.ticks[k]; render(); },
  save(){ save(); },
  lm(d){ S.listMonth = addMonth(S.listMonth, +d); S.items = null; render(); },
  rm(d){ S.month = addMonth(S.month, +d); S.summary = null; render(); },
  sv(v){ S.stockView = +v; render(); },
  async refresh(){ await boot(true); toast('已更新'); render(); },
  openEnt(id){ S.openEntry = S.openEntry === id ? '' : id; render(); },
  editEnt(id){
    const t = (S.items || []).find((x) => x.id === id); if (!t) return;
    if (!prefill(t)) { toast('這類紀錄請作廢後重記'); return; }
    S.editing = { id: t.id, title: entryText(t).title, date: t.date };
    S.tab = 'add'; render(); window.scrollTo(0, 0);
  },
  cancelEdit(){ S.editing = null; S.action = ''; initForms(); render(); },
  async void(id){
    const t = (S.items || []).find((x) => x.id === id); if (!t || t.status === '作廢') return;
    if (!confirm('作廢這筆？\n' + entryText(t).title + '\n\n作廢後會保留在試算表，但不計入報表，庫存也會還原。')) return;
    try { await api({ action: 'void', id }); toast('已作廢'); S.items = null; S.openEntry = ''; await boot(true); } catch(e){ toast(e.message); }
    render();
  },
  async login(){
    S.url = $('#cfg\\.url').value.trim(); S.user = $('#cfg\\.user').value.trim(); S.pin = $('#cfg\\.pin').value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(S.url)) return toast('網址格式不對，應以 /exec 結尾');
    try { await boot(); LS.set('isl_url', S.url); LS.set('isl_user', S.user); LS.set('isl_pin', S.pin); toast('連線成功'); S.tab = 'add'; render(); } catch(e){ toast(e.message); }
  },
  logout(){ if (!confirm('清除這台裝置上的連線設定？')) return; ['isl_url', 'isl_user', 'isl_pin'].forEach(LS.del); S.url = S.user = S.pin = ''; S.B = null; render(); }
};
document.addEventListener('click', (e) => { const el = e.target.closest('[data-a]'); if (!el) return; const fn = H[el.dataset.a]; if (fn) fn(el.dataset.v); });
// 打字時只在需要即時試算的欄位重畫，避免手機鍵盤跳動
const LIVE = (id) => id.indexOf('m.') === 0 || id === 'consign.price' || id === 'recon.amount';
// 日期欄位不重畫整頁：iPhone 的日期選擇器開著時重畫，會讓選擇器失效、改不了日期
function onDate(el){ setPath(el.dataset.in, el.value); const n = document.getElementById('course-note'); if (n && S.F.course) n.textContent = courseNote(S.F.course); }
document.addEventListener('input', (e) => { const el = e.target; if (!el.dataset || !el.dataset.in) return; if (el.type === 'date') return onDate(el); setPath(el.dataset.in, el.value); if (LIVE(el.dataset.in)) render(); });
document.addEventListener('change', (e) => { const el = e.target; if (el.dataset && el.dataset.in && el.type === 'date') onDate(el); });

async function boot(keepForms){
  const d = await api({ action: 'bootstrap' });
  S.B = d;
  if (!keepForms || !S.F.sale) initForms();
  if (!S.month) S.month = d.month;
  if (!S.listMonth) S.listMonth = d.month;
}
(async function(){
  render();
  if (!S.url || !S.user || !S.pin) { S.tab = 'set'; render(); return; }
  try { await boot(); render(); } catch(e){ toast(e.message); S.tab = 'set'; render(); }
})();
</script>
</body>
</html>
